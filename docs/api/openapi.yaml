  /admin/orders/{number}/status:
    post:
      operationId: changeOrderStatus
      tags: [admin]
      summary: Cambiar el estado de un pedido
      description: |-
        Mueve el pedido a `preparing`, `shipped`, `delivered` o `cancelled`. Para `shipped` hacen falta `carrier` y `trackingNumber` (se guardan en `tracking`); para los demás van en `null`. La `note` queda en el historial. El estado del pago no se edita: lo escribe el back a partir de Mercado Pago.

        Transiciones permitidas (las mismas que `adminOrderTargets` de `@galpon/domain`):

        | Estado del pedido | Destinos |
        | --- | --- |
        | `paid` | `preparing` o `shipped` |
        | `preparing` | `shipped` |
        | `shipped` | `delivered` |
        | `pending_payment` con pago `none`, `rejected` o `cancelled` | `cancelled`: libera la reserva de stock y cancela el intento de pago activo |
        | `pending_payment` con pago `pending` o `action_required` | ninguno: pedir `cancelled` responde `409` con `type` `payment_in_progress` |
        | `delivered`, `cancelled`, `expired` y `refunded` | ninguno |

        Cualquier otro cambio responde `409` con `type` `invalid_status_transition` (por ejemplo, cancelar un pedido pagado).
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusChange'
      responses:
        '200':
          description: Pedido con el estado nuevo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            El pedido no puede pasar a ese estado desde el que tiene (`invalid_status_transition`)
            o tiene un pago en curso y todavía no se puede cancelar (`payment_in_progress`). El
            dashboard muestra el motivo y vuelve a cargar el pedido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidStatusTransition:
                  summary: Transición inválida
                  value:
                    type: invalid_status_transition
                    title: Transición inválida
                    status: 409
                    detail: Un pedido pagado no se puede cancelar.
                paymentInProgress:
                  summary: Pago en curso
                  value:
                    type: payment_in_progress
                    title: Hay un pago en curso
                    status: 409
                    detail: 'Hay un pago en curso: esperá a que se resuelva para cancelar el pedido.'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
