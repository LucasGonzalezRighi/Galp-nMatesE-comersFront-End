  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: Listar los productos del dashboard
      description: >-
        Devuelve los productos en cualquier estado, paginados. Sin `status` se excluyen los
        archivados; para verlos hay que pedir `status=archived`. Los filtros se combinan entre sí
        (todos tienen que cumplirse).
      security:
        - adminSession: []
      parameters:
        - name: q
          in: query
          required: false
          description: >-
            Texto a buscar. Se compara sin acentos ni mayúsculas sobre el nombre y el código del
            producto.
          schema:
            type: string
            maxLength: 100
          example: bombillon
        - name: category
          in: query
          required: false
          description: Slug de la línea; deja solo los productos de esa línea.
          schema:
            type: string
            maxLength: 80
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          example: torpedos
        - name: status
          in: query
          required: false
          description: Estado del producto; deja solo los que están en ese estado.
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - name: stock
          in: query
          required: false
          description: Con `out`, deja solo los productos sin stock.
          schema:
            type: string
            enum: [out]
          example: out
        - name: sort
          in: query
