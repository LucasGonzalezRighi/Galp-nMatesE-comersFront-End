openapi: 3.1.0
info:
  title: Galpón Mates API
  version: 1.0.0
  summary: Contrato de la API REST de Galpón Mates.
  description: |
    Contrato entre el front (tienda y dashboard) y el back (NestJS) de Galpón Mates.

    Convenciones:

    - JSON en `camelCase`.
    - Montos en pesos enteros, con sufijo `Ars` (`priceArs`, `totalArs`).
    - Fechas en ISO 8601 UTC.
    - Listas paginadas con `?page=&pageSize=` (máximo 100) que responden `{ items, page, pageSize, total }`.
    - Errores en `application/problem+json` (RFC 9457), con el detalle por campo en `errors`.
    - `429` siempre trae `Retry-After`.
    - Las escrituras de pedidos y pagos llevan `Idempotency-Key` (un UUID por intento).

    Las rutas de este documento son relativas al prefijo `/api/v1` de `servers`.
  license:
    name: Propietaria
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.galponmates.com.ar/api/v1
    description: Producción
tags:
  - name: catalog
    description: Líneas de producto, catálogo y fichas de producto.
  - name: reviews
    description: Reseñas de los productos.
  - name: content
    description: Textos editables de la tienda (inicio, nosotros, preguntas, pie, pestañas y legales).
  - name: settings
    description: Ajustes públicos de la tienda (envíos, cuotas, descuento del kit y datos del vendedor).
  - name: cart
    description: Cotización del carrito y del envío.
  - name: orders
    description: Pedidos.
  - name: payments
    description: Pagos con Mercado Pago y sus avisos.
  - name: contact
    description: Formularios públicos de contacto y de arrepentimiento.
  - name: account
    description: Cuenta del cliente, sesión y libreta de direcciones.
  - name: admin
    description: Dashboard de administración.
paths:
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: Listar las líneas de producto
      description: >-
        Devuelve todas las líneas, ordenadas por `position`, con la cantidad de productos
        publicados de cada una.
      security: []
      responses:
        '200':
          description: Líneas de producto.
          content:
            application/json:
              schema:
                type: array
                description: Líneas ordenadas por `position`.
                items:
                  $ref: '#/components/schemas/Category'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: Listar el catálogo publicado
      description: >-
        Devuelve los productos publicados, paginados. Los filtros se combinan entre sí (todos
        tienen que cumplirse). La tienda pide el catálogo completo con `pageSize=100`.
      security: []
      parameters:
        - name: category
          in: query
          required: false
          description: Slug de la línea; deja solo los productos de esa línea.
          schema:
            type: string
            maxLength: 80
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          example: torpedos
        - name: group
          in: query
          required: false
          description: Grupo de producto; deja solo los productos de ese grupo.
          schema:
            $ref: '#/components/schemas/ProductGroup'
        - name: ids
          in: query
          required: false
          description: Ids de producto separados por coma; deja solo esos productos.
          schema:
            type: string
            minLength: 1
            maxLength: 4000
          example: prd-galleta,prd-imperial-premium
        - name: q
          in: query
          required: false
          description: >-
            Texto a buscar. Se compara sin acentos ni mayúsculas sobre el nombre, la descripción
            y la línea del producto.
          schema:
            type: string
            maxLength: 100
          example: bombillon
        - name: sort
          in: query
          required: false
          description: Orden de los resultados.
          schema:
            $ref: '#/components/schemas/ProductSortOrder'
            default: destacados
        - name: featured
          in: query
          required: false
          description: Con `true`, deja solo los productos destacados.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de productos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Obtener la ficha de un producto
      description: >-
        Devuelve el producto publicado. Si el `slug` es uno anterior (el producto se renombró),
        responde `200` igual, con el producto y su `slug` actual: la tienda lo compara con el
        pedido y redirige con `308`. Si el producto no está publicado, responde `404`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductSlug'
      responses:
        '200':
          description: Ficha del producto, con su `slug` actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /products/{slug}/related:
    get:
      operationId: listRelatedProducts
      tags: [catalog]
      summary: Listar los productos relacionados
      description: >-
        Devuelve hasta 4 productos relacionados: primero los de la misma línea y después los del
        mismo grupo en otras líneas. Nunca incluye al producto pedido.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductSlug'
      responses:
        '200':
          description: Productos relacionados (puede estar vacía).
          content:
            application/json:
              schema:
                type: array
                description: Hasta 4 productos.
                maxItems: 4
                items:
                  $ref: '#/components/schemas/ProductSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /products/{slug}/reviews:
    get:
      operationId: listProductReviews
      tags: [reviews]
      summary: Listar las reseñas de un producto
      description: >-
        Devuelve las reseñas aprobadas del producto, de la más nueva a la más vieja, junto con
        el promedio y la distribución por estrellas de todas las aprobadas (no solo de la página).
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductSlug'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Página de reseñas con sus estadísticas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createReview
      tags: [reviews]
      summary: Enviar una reseña
      description: >-
        Recibe la reseña de un producto. No se publica enseguida: queda pendiente hasta que el
        administrador la aprueba, por eso responde `202`. Si `authorName` es `null` o vacío, el
        back la firma como "Anónimo". `website` es un campo trampa contra bots (ver `Honeypot`).
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '202':
          description: Reseña recibida; queda pendiente de aprobación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewReceipt'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /reviews/featured:
    get:
      operationId: listFeaturedReviews
      tags: [reviews]
      summary: Listar las reseñas destacadas del inicio
      description: Devuelve las reseñas aprobadas y marcadas como destacadas, con el producto de cada una.
      security: []
      responses:
        '200':
          description: Reseñas destacadas.
          content:
            application/json:
              schema:
                type: array
                description: Reseñas destacadas, de la más nueva a la más vieja.
                items:
                  $ref: '#/components/schemas/FeaturedReview'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /content/home:
    get:
      operationId: getHomeContent
      tags: [content]
      summary: Obtener los textos del inicio
      description: Devuelve los textos editables de la página de inicio.
      security: []
      responses:
        '200':
          description: Textos del inicio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /content/about:
    get:
      operationId: getAboutContent
      tags: [content]
      summary: Obtener los textos de Nosotros
      description: Devuelve los textos editables de la página Nosotros.
      security: []
      responses:
        '200':
          description: Textos de Nosotros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /content/faq:
    get:
      operationId: getFaqContent
      tags: [content]
      summary: Obtener las preguntas frecuentes
      description: Devuelve las preguntas frecuentes, agrupadas por categoría.
      security: []
      responses:
        '200':
          description: Preguntas frecuentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /content/footer:
    get:
      operationId: getFooterContent
      tags: [content]
      summary: Obtener los textos del pie
      description: Devuelve los textos editables del pie de página.
      security: []
      responses:
        '200':
          description: Textos del pie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FooterContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /content/product-tabs:
    get:
      operationId: getProductTabsContent
      tags: [content]
      summary: Obtener los textos de las pestañas de producto
      description: >-
        Devuelve los textos de las pestañas de la ficha por grupo de producto. Son los textos de
        fábrica: la ficha (`ProductDetail.tabs`) ya viene con el texto del producto, si lo tiene,
        o con el del grupo.
      security: []
      responses:
        '200':
          description: Textos de las pestañas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductTabsContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /content/legal/{document}:
    get:
      operationId: getLegalContent
      tags: [content]
      summary: Obtener un documento legal
      description: Devuelve los términos y condiciones (`terms`) o la política de privacidad (`privacy`).
      security: []
      parameters:
        - $ref: '#/components/parameters/LegalDocument'
      responses:
        '200':
          description: Documento legal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalContent'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /settings/public:
    get:
      operationId: getPublicSettings
      tags: [settings]
      summary: Obtener los ajustes públicos
      description: >-
        Devuelve los ajustes que necesita la tienda: descuento del kit, opciones de envío,
        cuotas, mail de contacto, cómo mostrar el precio y datos del vendedor.
      security: []
      responses:
        '200':
          description: Ajustes públicos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSettings'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /cart/quote:
    post:
      operationId: quoteCart
      tags: [cart]
      summary: Cotizar el carrito
      description: >-
        Recibe las líneas del carrito y devuelve los importes que calcula el back, con el ahorro
        por kit y la disponibilidad de cada línea. Es la fuente de verdad de los importes en el
        checkout: la tienda no calcula precios por su cuenta. No reserva stock. Una línea con
        problemas no hace fallar la cotización: se informa en su `issue` y el front decide qué
        mostrar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartQuoteInput'
      responses:
        '200':
          description: Cotización del carrito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartQuote'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /shipping/quote:
    post:
      operationId: quoteShipping
      tags: [cart]
      summary: Cotizar el envío
      description: >-
        Devuelve el costo y el plazo del envío para un método, un código postal y los productos
        del carrito. En esta versión la tienda no la usa: el costo sale de
        `PublicSettings.shippingOptions` y es fijo por método. Queda en el contrato para cuando
        el costo dependa del destino. `postalCode` puede ser `null` en `pickup`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingQuoteInput'
      responses:
        '200':
          description: Costo y plazo del envío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingQuote'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Crear un pedido
      description: >-
        Valida los datos, recalcula precios, kits, envío y stock, reserva el stock durante 30
        minutos y crea el pedido en `pending_payment`, sin cobrar. Si el total que calculó el
        back es distinto de `expectedTotalArs`, o cambió un precio o el stock, responde `409` con
        `type` `total_changed`, `price_changed` o `stock_changed` y el detalle en `changes`, y no
        crea nada: el front muestra qué cambió, actualiza el resumen y, si la persona acepta,
        reintenta con una `Idempotency-Key` nueva.


        Con la misma `Idempotency-Key` (se recuerda 24 horas) devuelve el pedido ya creado en
        lugar de crear otro, y si el cuerpo es distinto responde `422`. Si hay una sesión de
        cliente, el pedido queda en su cuenta.


        El `orderToken` se entrega solo en esta respuesta. El front lo guarda y lo manda en
        `X-Order-Token` para consultar y pagar el pedido; nunca va en la dirección web.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderInput'
      responses:
        '201':
          description: Pedido creado, con el token para consultarlo y pagarlo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotentValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /orders/{number}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Obtener un pedido
      description: >-
        Devuelve el pedido a quien presenta su `X-Order-Token` o a la sesión del cliente dueño del
        pedido. Si el pedido no existe, o el token falta o no corresponde, responde `404` igual en
        todos los casos, para no revelar si el número existe. Es lo que consulta la pantalla
        `/checkout/resultado`.


        **Vencimiento**: el pedido vence en `reservedUntil`, 30 minutos después de crearlo. Si
        pasa ese momento sin pago, el back lo marca `expired` y libera el stock reservado (la
        respuesta ya lo informa así).
      security:
        - orderToken: []
        - customerSession: []
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      responses:
        '200':
          description: Pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /orders/{number}/payments/mercadopago/preference:
    post:
      operationId: createMercadoPagoPreference
      tags: [payments]
      summary: Crear la preferencia de pago en Mercado Pago
      description: >-
        Crea la preferencia de Mercado Pago del pedido y devuelve `initPoint`, la dirección a la
        que el front redirige al cliente para que pague. La preferencia vence junto con la reserva
        de stock del pedido.


        **Idempotencia**: con la misma `Idempotency-Key` devuelve la misma preferencia en lugar de
        crear otra, y si la clave ya se usó con otros datos responde `422` con `type`
        `idempotency_key_reused`.


        **Un intento de pago activo por pedido**: si el pedido ya tenía una preferencia o un pago
        pendiente, el back lo cancela antes de crear este. Si igual llegara un segundo pago
        aprobado, se marca para devolverlo y aparece como alerta en el dashboard.


        **El estado definitivo llega por webhook**: la redirección de vuelta de Mercado Pago no
        prueba nada. El pedido pasa a pagado solo cuando el back recibe la notificación (ver
        `POST /webhooks/mercadopago`); el front lo consulta con `GET /orders/{number}`.
      security:
        - orderToken: []
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Preferencia creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MercadoPagoPreference'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El pedido ya está pagado o venció, así que no admite un pago nuevo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: order_not_payable
                title: El pedido no admite un pago nuevo
                status: 409
                detail: El pedido ya está pagado o venció.
        '422':
          $ref: '#/components/responses/IdempotentValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /orders/{number}/payments/mercadopago/card:
    post:
      operationId: payWithCard
      tags: [payments]
      summary: Pagar un pedido con tarjeta
      description: >-
        Cobra el pedido con el token de tarjeta que generó MercadoPago.js en el navegador. Los
        datos de la tarjeta nunca pasan por esta API: solo viaja el token, que es de un solo uso
        (cada intento lleva uno nuevo).


        **Idempotencia**: con la misma `Idempotency-Key` devuelve el resultado del primer intento
        en lugar de cobrar otra vez, y si el cuerpo es distinto responde `422`.


        **Un intento de pago activo por pedido**: al iniciar uno nuevo, el back cancela el pago
        pendiente anterior.


        **El estado definitivo llega por webhook**: `paymentStatus` es el estado en este momento,
        no el final. Si trae `challenge` (verificación 3-D Secure), el front abre esa dirección en
        un diálogo y después consulta el pedido. El pedido pasa a pagado solo cuando el back
        recibe la notificación de Mercado Pago (ver `POST /webhooks/mercadopago`).
      security:
        - orderToken: []
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPaymentInput'
      responses:
        '200':
          description: Resultado del intento de pago.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPaymentResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El pedido ya está pagado o venció, así que no admite un pago nuevo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: order_not_payable
                title: El pedido no admite un pago nuevo
                status: 409
                detail: El pedido ya está pagado o venció.
        '422':
          $ref: '#/components/responses/IdempotentValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /orders/{number}/payments/mercadopago/installments:
    post:
      operationId: getInstallments
      tags: [payments]
      summary: Consultar las cuotas de una tarjeta
      description: >-
        Devuelve las opciones de cuotas que Mercado Pago ofrece para la tarjeta que empieza con
        `bin`, con el costo financiero de cada una. Las calcula sobre el total del pedido
        (`Order.totalArs`), nunca sobre un monto que mande el front, así que lo que se muestra es
        siempre lo que después se cobra. El front la usa en lugar de llamar a Mercado Pago
        directamente, y en el modo de prueba el simulador la responde con la tabla de ajustes.


        Solo manda los primeros dígitos de la tarjeta (`bin`), que no alcanzan para usarla. No
        lleva `Idempotency-Key` porque no cobra ni cambia nada. Con `debit_card` devuelve una sola
        opción, de 1 pago.
      security:
        - orderToken: []
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallmentsInput'
      responses:
        '200':
          description: Opciones de cuotas, de menos a más cuotas. La primera es siempre de 1 pago.
          content:
            application/json:
              schema:
                type: array
                description: Opciones de cuotas para la tarjeta.
                minItems: 1
                maxItems: 24
                items:
                  $ref: '#/components/schemas/InstallmentOption'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El pedido ya está pagado o venció, así que no admite un pago nuevo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: order_not_payable
                title: El pedido no admite un pago nuevo
                status: 409
                detail: El pedido ya está pagado o venció.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /orders/{number}/cancel-payment:
    post:
      operationId: cancelPayment
      tags: [payments]
      summary: Cancelar el intento de pago activo
      description: >-
        Cancela el intento de pago activo del pedido (la preferencia de Mercado Pago o el pago
        pendiente) para que el cliente pueda probar con otro medio. Hay **un solo intento activo
        por pedido**: el front la llama antes de iniciar uno nuevo. El intento queda `cancelled`;
        el pedido sigue en `pending_payment` y conserva la reserva de stock, así que `reservedUntil`
        no cambia.


        Si no hay un intento activo, responde `204` igual, así que repetirla no hace daño. No
        lleva `Idempotency-Key`. Si el pedido ya está pagado o venció, responde `409`.
      security:
        - orderToken: []
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      responses:
        '204':
          description: Intento cancelado, o no había ninguno activo.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El pedido ya está pagado o venció, así que no hay un intento para cancelar.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: order_not_payable
                title: El pedido no admite un pago nuevo
                status: 409
                detail: El pedido ya está pagado o venció.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /contact:
    post:
      operationId: sendContactMessage
      tags: [contact]
      summary: Enviar un mensaje de contacto
      description: >-
        Recibe el mensaje del formulario de contacto y lo deja en la bandeja del dashboard.
        Responde `202` sin cuerpo. `website` es un campo trampa contra bots (ver `Honeypot`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '202':
          description: Mensaje recibido.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /withdrawals:
    post:
      operationId: requestWithdrawal
      tags: [contact]
      summary: Pedir el arrepentimiento de una compra
      description: >-
        Registra una solicitud de arrepentimiento (10 días corridos desde que se recibe el
        producto, sin causa y sin costo) y devuelve un código de comprobante. Pide los mínimos
        datos: el número de pedido y el comentario son opcionales. La solicitud queda en la
        bandeja del dashboard como mensaje de tipo `withdrawal`. `website` es un campo trampa
        contra bots (ver `Honeypot`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalInput'
      responses:
        '201':
          description: Solicitud registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalReceipt'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /webhooks/mercadopago:
    post:
      operationId: receiveMercadoPagoWebhook
      tags: [payments]
      summary: Recibir una notificación de Mercado Pago
      description: >-
        Solo lo llama Mercado Pago; el front no lo usa. Está en el contrato para que el back lo
        implemente. Es la única fuente del estado definitivo del pago.


        El back valida la firma `x-signature` (con `x-request-id` y el `data.id` de la dirección),
        consulta el pago en Mercado Pago, traduce su estado a `PaymentStatus` y actualiza el
        pedido. Procesa cada notificación una sola vez aunque Mercado Pago la reenvíe. Responde
        `200` cuando la registró; con una firma inválida responde `401` y no hace nada.
      security: []
      parameters:
        - name: x-signature
          in: header
          required: true
          description: Firma de la notificación, con el formato `ts=<marca de tiempo>,v1=<hash>`.
          schema:
            type: string
          example: ts=1742505638683,v1=ced36ab6d33566bb1e16c125819b8d840d6b8ef136b0b9127c76064466f5229b
        - name: x-request-id
          in: header
          required: true
          description: Identificador de la solicitud que genera Mercado Pago; entra en el cálculo de la firma.
          schema:
            type: string
          example: 4a1b9d7e-6f3c-4b0a-8c52-9d1e7f2a3b4c
        - name: data.id
          in: query
          required: false
          description: Identificador del pago, repetido en la dirección; entra en el cálculo de la firma.
          schema:
            type: string
          example: '1234567890'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MercadoPagoWebhookEvent'
      responses:
        '200':
          description: Notificación registrada.
        '401':
          description: La firma no es válida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: invalid_signature
                title: Firma inválida
                status: 401
                detail: La firma de la notificación no coincide.
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/csrf:
