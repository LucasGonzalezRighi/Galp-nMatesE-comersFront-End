        Reemplaza los textos de las pestañas de producto: el cuerpo lleva el contenido completo.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductTabsContent'
      responses:
        '200':
          description: Textos guardados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductTabsContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/content/legal/{document}:
    get:
      operationId: getAdminLegalContent
      tags: [admin]
      summary: Obtener un documento legal
      description: >-
        Devuelve los términos y condiciones (`terms`) o la política de privacidad (`privacy`).
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/LegalDocument'
      responses:
        '200':
          description: Documento legal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      operationId: updateAdminLegalContent
      tags: [admin]
      summary: Guardar un documento legal
      description: >-
        Reemplaza el documento legal: el cuerpo lleva el documento completo.
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/LegalDocument'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalContent'
      responses:
        '200':
          description: Documento guardado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Obtener los ajustes del dashboard
      description: >-
        Devuelve los ajustes públicos de la tienda más los que solo ve el dashboard: el umbral
        de poco stock y el IVA.
      security:
        - adminSession: []
      responses:
        '200':
          description: Ajustes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Guardar los ajustes
      description: >-
        Reemplaza los ajustes: el cuerpo lleva todos. Tienen que venir las tres opciones de
        envío, una por método. El back ignora `shippingOptions[].label`: el nombre de cada
        método es fijo.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSettings'
      responses:
        '200':
          description: Ajustes guardados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/reviews:
    get:
      operationId: listAdminReviews
      tags: [admin]
      summary: Listar las reseñas
      description: >-
        Devuelve las reseñas en cualquier estado, de la más nueva a la más vieja, de a 20 por
        página.
      security:
        - adminSession: []
      parameters:
        - name: status
          in: query
          required: false
          description: Estado de la reseña; deja solo las que están en ese estado.
          schema:
            $ref: '#/components/schemas/ReviewStatus'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Página de reseñas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReviewPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/reviews/{id}:
    patch:
      operationId: updateAdminReview
      tags: [admin]
      summary: Moderar una reseña
      description: >-
        Cambia el estado de la reseña (la aprueba, la oculta o la deja pendiente) o si es
        destacada. Solo se modifican los campos que vienen en el cuerpo. Las aprobadas cuentan
        en el promedio del producto y se muestran en la ficha.
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReviewUpdate'
      responses:
        '200':
          description: Reseña modificada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/messages:
    get:
      operationId: listAdminMessages
      tags: [admin]
      summary: Listar los mensajes
      description: >-
        Devuelve los mensajes del formulario de contacto y las solicitudes de arrepentimiento,
        del más nuevo al más viejo, de a 20 por página.
      security:
        - adminSession: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Tipo de mensaje; deja solo los de ese tipo.
          schema:
            $ref: '#/components/schemas/ContactMessageKind'
        - name: read
          in: query
          required: false
          description: >-
            Con `true`, deja solo los mensajes leídos; con `false`, solo los no leídos.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Página de mensajes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessagePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/messages/{id}:
    patch:
      operationId: updateAdminMessage
      tags: [admin]
      summary: Marcar un mensaje como leído o no leído
      description: >-
        Cambia si el mensaje está leído. Los no leídos se cuentan en `unreadMessages` del
        resumen.
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessageUpdate'
      responses:
        '200':
          description: Mensaje modificado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    customerSession:
      type: apiKey
      in: cookie
      name: __Host-galpon_session
      description: >-
        Sesión del cliente. Cookie `HttpOnly`, `Secure` y `SameSite=Lax` que pone el back al
        iniciar sesión.
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-galpon_admin
      description: >-
        Sesión del administrador. Cookie `HttpOnly`, `Secure` y `SameSite=Lax` que pone el
        back al iniciar sesión en el dashboard.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Token anti-CSRF que se obtiene en `/auth/csrf` o `/admin/auth/csrf`. Va en toda escritura
        con sesión. Lo agrega el middleware del cliente, no cada llamada.
    orderToken:
      type: apiKey
      in: header
      name: X-Order-Token
      description: >-
        Token que devuelve la creación del pedido. Permite ver y pagar ese pedido sin tener
        cuenta. Lo agrega el middleware del cliente, no cada llamada.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Número de página, empezando en 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Cantidad de elementos por página (de 1 a 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24
    ProductSlug:
      name: slug
      in: path
      required: true
      description: Slug del producto. Admite también un slug anterior del mismo producto.
      schema:
        type: string
        minLength: 1
        maxLength: 80
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      example: mate-imperial-premium
    LegalDocument:
      name: document
      in: path
      required: true
      description: 'Documento legal: `terms` (términos y condiciones) o `privacy` (política de privacidad).'
      schema:
        type: string
        enum: [terms, privacy]
      example: terms
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        UUID que genera el cliente para cada intento. Repetir la misma clave devuelve el resultado
        del primer intento en lugar de crear otro pedido o cobro. Repetirla con otro cuerpo
        responde `422` con `type` `idempotency_key_reused`: cada intento distinto lleva una clave
        nueva.
      schema:
        type: string
        format: uuid
      example: 3f2b8c1e-5d4a-4e7b-9a60-1c2d3e4f5a6b
    OrderNumber:
      name: number
      in: path
      required: true
      description: Número del pedido, `GLP-` y cinco dígitos.
      schema:
        $ref: '#/components/schemas/OrderNumber'
      example: GLP-12345
    AddressId:
      name: id
      in: path
      required: true
      description: Identificador de una dirección de la libreta del cliente.
      schema:
        type: string
        minLength: 1
        maxLength: 80
      example: adr-0001
    AdminProductId:
      name: id
      in: path
      required: true
      description: Identificador de un producto.
      schema:
        type: string
        minLength: 1
        maxLength: 80
      example: prd-imperial-premium
    AdminCategoryId:
      name: id
      in: path
      required: true
      description: Identificador de una línea de producto.
      schema:
        type: string
        minLength: 1
        maxLength: 80
      example: cat-imperiales
    ReviewId:
      name: id
      in: path
      required: true
      description: Identificador de una reseña.
      schema:
        type: string
        minLength: 1
        maxLength: 80
      example: rev-0001
    MessageId:
      name: id
      in: path
      required: true
      description: Identificador de un mensaje.
      schema:
        type: string
        minLength: 1
        maxLength: 80
      example: msg-0001
  responses:
    ValidationError:
      description: Los datos enviados no son válidos. `errors` detalla cada campo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: validation_error
            title: Los datos no son válidos
            status: 422
            detail: Revisá los campos marcados.
            errors:
              - field: page
                code: too_small
                message: La página tiene que ser mayor o igual a 1.
    IdempotentValidationError:
      description: >-
        Los datos enviados no son válidos (`validation_error`, con `errors` por campo) o la
        `Idempotency-Key` ya se usó con otros datos (`idempotency_key_reused`): cada intento
        distinto lleva una clave nueva.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validationError:
              summary: Datos inválidos
              value:
                type: validation_error
                title: Los datos no son válidos
                status: 422
                detail: Revisá los campos marcados.
                errors:
                  - field: customer.email
                    code: invalid_email
                    message: Ingresá un email válido
            idempotencyKeyReused:
              summary: Clave ya usada con otros datos
              value:
                type: idempotency_key_reused
                title: La clave ya se usó
                status: 422
                detail: La Idempotency-Key ya se usó con otros datos. Generá una nueva para este intento.
    Unauthorized:
      description: Falta la sesión o venció.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: unauthorized
            title: Sesión requerida
            status: 401
            detail: Iniciá sesión para continuar.
    Forbidden:
      description: >-
        La sesión es válida pero no alcanza para esta operación. Con `type` `csrf_invalid` falta
        el token CSRF o no es válido (por ejemplo, porque otro inicio de sesión lo rotó): el
        front pide uno nuevo y le pide a la persona que reintente, sin repetir la escritura solo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            csrfInvalid:
              summary: Token CSRF inválido
              value:
                type: csrf_invalid
                title: Token CSRF inválido
                status: 403
                detail: El token CSRF falta o no es válido.
            forbidden:
              summary: Acceso denegado
              value:
                type: forbidden
                title: Acceso denegado
                status: 403
                detail: No tenés permiso para hacer esto.
    NotFound:
      description: El recurso no existe o no está publicado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: not_found
            title: No encontrado
            status: 404
            detail: No existe un producto con ese slug.
    Conflict:
      description: >-
        La operación choca con el estado actual. `type` dice el motivo (por ejemplo `stock_changed`
        en un pedido) y `changes` detalla qué cambió.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: stock_changed
            title: El stock cambió
            status: 409
            detail: Un producto del carrito ya no tiene el stock pedido.
            changes:
              - kind: stock
                productId: prd-camionero-pelo
                message: Quedan 2 unidades de Mate Camionero Criollo con Pelo.
    RateLimited:
      description: Demasiadas solicitudes. `Retry-After` dice en cuántos segundos reintentar.
      headers:
        Retry-After:
          required: true
          description: Segundos que hay que esperar antes de reintentar.
          schema:
            type: integer
            minimum: 1
          example: 30
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: rate_limited
            title: Demasiadas solicitudes
            status: 429
            detail: Esperá unos segundos y volvé a intentar.
    ServerError:
      description: Error inesperado del servidor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: server_error
            title: Error del servidor
            status: 500
            detail: Algo salió mal de nuestro lado. Probá de nuevo en un rato.
    SlugTaken:
      description: >-
        Ya hay un producto o una línea con ese `slug` (en un producto, también si alguno lo tuvo
        antes y la tienda lo redirige).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: slug_taken
            title: El slug ya está en uso
            status: 409
            detail: Ya hay algo con el slug mate-imperial-premium.
  schemas:
    Problem:
      type: object
      description: >-
        Error en formato `application/problem+json` (RFC 9457). `type` es un identificador estable
        en `snake_case` (por ejemplo `validation_error`, `not_found`, `stock_changed`).
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Identificador estable del tipo de error, en `snake_case`.
          example: validation_error
        title:
          type: string
          description: Resumen corto del error, en español.
          example: Los datos no son válidos
        status:
          type: integer
          description: Código HTTP de la respuesta.
          minimum: 400
          maximum: 599
          example: 422
        detail:
          type: string
          description: Explicación de esta ocurrencia, en español.
          example: Revisá los campos marcados.
        instance:
          type: string
          description: Identificador de esta ocurrencia, útil para buscarla en los registros.
          example: /orders/GLP-12345
        errors:
          type: array
          description: Errores por campo (en validaciones).
          items:
            $ref: '#/components/schemas/FieldError'
        changes:
          type: array
          description: Qué cambió desde que el cliente armó el pedido (en conflictos de pedido).
          items:
            $ref: '#/components/schemas/ChangeNotice'
    FieldError:
      type: object
      description: Error de validación de un campo.
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Ruta del campo con puntos, por ejemplo `customer.email`.
          example: customer.email
        code:
          type: string
          description: Código estable del error, en `snake_case`.
          example: invalid_email
        message:
          type: string
          description: Mensaje para mostrar al usuario, en español.
          example: Ingresá un mail válido.
    ChangeNotice:
      type: object
      description: Aviso de un cambio ocurrido entre que el cliente armó el pedido y que se confirmó.
      required: [kind, productId, message]
      properties:
        kind:
          type: string
          description: Qué cambió.
          enum: [price, stock, discount, shipping, unavailable]
          example: stock
        productId:
          type: [string, 'null']
          description: Producto afectado, o `null` si el cambio no es de un producto (envío o descuento).
          example: prd-camionero-pelo
        message:
          type: string
          description: Explicación del cambio, en español.
          example: Quedan 2 unidades de Mate Camionero Criollo con Pelo.
    Pesos:
      type: integer
      description: Monto en pesos argentinos, entero, no negativo y de hasta 99.999.999.
      minimum: 0
      maximum: 99999999
      example: 39999
    TotalArs:
      type: integer
      description: >-
        Monto en pesos argentinos que resulta de sumar o multiplicar otros (el total de una línea,
        el precio de lista de un kit, que suma tres piezas, el subtotal o el total del pedido):
        entero, no negativo y de hasta 2.147.483.647, el máximo de un entero de 32 bits. El precio
        de un producto o de una pieza usa `Pesos`, con tope menor.
      minimum: 0
      maximum: 2147483647
      example: 68397
    NullablePesos:
      type: [integer, 'null']
      description: Monto en pesos argentinos, entero, no negativo y de hasta 99.999.999, o `null` cuando no corresponde (por ejemplo, "a consultar").
      minimum: 0
      maximum: 99999999
      example: 39999
    ProductGroup:
      type: string
      description: Grupo al que pertenece un producto.
      enum: [mate, bombilla, yerba]
      example: mate
    Leather:
      type: string
      description: Cuero de la funda de un mate.
      enum: [Negro, Marrón, Crudo, Borravino]
      example: Negro
    Ferrule:
      type: string
      description: Virola de un mate.
      enum: [Alpaca lisa, Alpaca cincelada, Acero]
      example: Alpaca cincelada
    ProductSortOrder:
      type: string
      description: Orden del catálogo. `destacados` pone primero los destacados, `menor` y `mayor` ordenan por precio y `az` por nombre.
      enum: [destacados, menor, mayor, az]
      example: destacados
    ShippingMethod:
      type: string
      description: Método de envío. `home` es a domicilio, `branch` a sucursal y `pickup` retiro en persona.
      enum: [home, branch, pickup]
      example: home
    Image:
      type: object
      description: Foto alojada en el proveedor de imágenes.
      required: [publicId, url, width, height, alt]
      properties:
        publicId:
          type: string
          description: Identificador de la foto en el proveedor de imágenes.
          example: galpon/productos/mate-imperial-premium
        url:
          type: string
          description: Dirección de la foto, absoluta o relativa al sitio.
          example: https://res.cloudinary.com/galpon/image/upload/galpon/productos/mate-imperial-premium.jpg
        width:
          type: integer
          description: Ancho en píxeles.
          minimum: 1
          example: 960
        height:
          type: integer
          description: Alto en píxeles.
          minimum: 1
          example: 1280
        alt:
          type: string
          description: Texto alternativo para lectores de pantalla.
          example: Mate Imperial Premium con virola de alpaca cincelada y base con pelotitas de bronce
    Category:
      type: object
      description: Línea de producto (por ejemplo "Imperiales" o "Bombillones").
      required: [id, slug, name, group, blurb, image, position, productCount]
      properties:
        id:
          type: string
          description: Identificador de la línea.
          example: cat-imperiales
        slug:
          type: string
          description: Identificador legible para la dirección web.
          example: imperiales
        name:
          type: string
          description: Nombre de la línea.
          example: Imperiales
        group:
          $ref: '#/components/schemas/ProductGroup'
        blurb:
          type: string
          description: Descripción corta de la línea.
          example: Boca ancha, virola de alpaca y pie de apoyo. El mate de ceremonia.
        image:
          description: Foto de la línea, o `null` si todavía no tiene.
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        position:
          type: integer
          description: Lugar de la línea en el listado, empezando en 1.
          minimum: 1
          example: 1
        productCount:
          type: integer
          description: Cantidad de productos publicados de la línea.
          minimum: 0
          example: 4
    Rating:
      type: object
      description: Calificación de un producto, calculada sobre sus reseñas aprobadas.
      required: [average, count]
      properties:
        average:
          type: number
          description: Promedio de 0 a 5, sin redondear (el front lo muestra con un decimal). Es 0 si no hay reseñas.
          minimum: 0
          maximum: 5
          example: 4.7
        count:
          type: integer
          description: Cantidad de reseñas aprobadas.
          minimum: 0
          example: 3
    ProductSummary:
      type: object
      description: Producto como se muestra en listados y tarjetas.
      required:
        - id
        - slug
        - code
        - name
        - description
        - categoryId
        - categorySlug
        - categoryName
        - group
        - priceArs
        - netPriceArs
        - isPurchasable
        - isSoldOut
        - maxQuantity
        - featured
        - mainImage
        - rating
      properties:
        id:
          type: string
          description: Identificador del producto.
          example: prd-imperial-premium
        slug:
          type: string
          description: Identificador legible para la dirección web. Cambia si se renombra el producto.
          example: mate-imperial-premium
        code:
          type: string
          description: Código correlativo que se muestra en la ficha (por ejemplo "N°07"). Lo asigna el back y no se edita.
          example: N°01
        name:
          type: string
          description: Nombre del producto.
          example: Mate Imperial Premium
        description:
          type: string
          description: Descripción del producto.
          example: Imperial con virola y base de alpaca con pelotitas en bronce.
        categoryId:
          type: string
          description: Identificador de la línea del producto.
          example: cat-imperiales
        categorySlug:
          type: string
          description: Slug de la línea del producto.
          example: imperiales
        categoryName:
          type: string
          description: Nombre de la línea del producto.
          example: Imperiales
        group:
          $ref: '#/components/schemas/ProductGroup'
        priceArs:
          description: Precio de venta con impuestos incluidos, o `null` si el producto es "a consultar" (no se puede comprar).
          $ref: '#/components/schemas/NullablePesos'
        netPriceArs:
          description: Precio sin impuestos nacionales (Ley 27.743), o `null` si `priceArs` es `null`.
          $ref: '#/components/schemas/NullablePesos'
        isPurchasable:
          type: boolean
          description: Si se puede agregar al carrito. Es verdadero si está publicado, tiene precio y hay stock.
          example: true
        isSoldOut:
          type: boolean
          description: Si no queda stock.
          example: false
        maxQuantity:
          type: integer
          description: Cantidad máxima que se puede pedir de una vez, es decir el menor entre 20 y el stock (0 si no hay stock).
          minimum: 0
          maximum: 20
          example: 12
        featured:
          type: boolean
          description: Si es un producto destacado.
          example: false
        mainImage:
          description: Foto principal, o `null` si todavía no tiene.
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        rating:
          $ref: '#/components/schemas/Rating'
      example:
        id: prd-imperial-premium
        slug: mate-imperial-premium
        code: N°01
        name: Mate Imperial Premium
        description: Imperial con virola y base de alpaca con pelotitas en bronce.
        categoryId: cat-imperiales
        categorySlug: imperiales
        categoryName: Imperiales
        group: mate
        priceArs: 39999
        netPriceArs: 33057
        isPurchasable: true
        isSoldOut: false
        maxQuantity: 12
        featured: false
        mainImage:
          publicId: galpon/productos/mate-imperial-premium
          url: /mock-images/mate-imperial-premium.jpg
          width: 960
          height: 1280
          alt: Mate Imperial Premium con virola de alpaca cincelada y base con pelotitas de bronce
        rating:
          average: 4.7
          count: 3
    ProductTabs:
      type: object
      description: Textos de las pestañas de la ficha. Ya vienen combinados, con el texto del producto si lo tiene o, si no, el de su grupo.
      required: [descriptionNote, materials, shipping, care]
      properties:
        descriptionNote:
          type: [string, 'null']
          description: Nota que se muestra debajo de la descripción, o `null` si no hay (por ejemplo, la de "cada pieza es artesanal" de los mates).
          example: Cada pieza es artesanal, así que los tonos de la calabaza, el cuero y el cincelado pueden variar.
        materials:
          type: string
          description: Texto de la pestaña de materiales (o de contenido, en las yerbas).
          example: Calabaza natural curable, virola de alpaca o acero según variante y cuero vacuno cosido a mano.
        shipping:
          type: string
          description: Texto de la pestaña de envío y cambios.
          example: Enviamos a todo el país. También podés retirar sin costo.
        care:
          type: string
          description: Texto de la pestaña de cuidado (o de conservación, en las yerbas).
          example: Curalo antes del primer uso y secalo boca abajo después de cada ronda.
    ProductOptions:
      type: object
      description: Opciones a elegir en un mate. No cambian el precio.
      required: [leathers, ferrules]
      properties:
        leathers:
          type: array
          description: Cueros disponibles.
          items:
            $ref: '#/components/schemas/Leather'
        ferrules:
          type: array
          description: Virolas disponibles.
          items:
            $ref: '#/components/schemas/Ferrule'
    ProductDetail:
      description: Producto completo, como se muestra en su ficha.
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [images, tabs, options]
          properties:
            images:
              type: array
              description: Todas las fotos del producto, en el orden en que se muestran.
              items:
                $ref: '#/components/schemas/Image'
            tabs:
              $ref: '#/components/schemas/ProductTabs'
            options:
              description: Opciones a elegir, o `null` si el producto no tiene (solo los mates las tienen).
              oneOf:
                - $ref: '#/components/schemas/ProductOptions'
                - type: 'null'
    ProductPage:
      type: object
      description: Página de productos.
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          description: Productos de la página.
          items:
            $ref: '#/components/schemas/ProductSummary'
        page:
          type: integer
          description: Número de esta página, empezando en 1.
          minimum: 1
          example: 1
        pageSize:
          type: integer
          description: Cantidad de elementos por página que aplicó el servidor.
          minimum: 1
          maximum: 100
          example: 24
        total:
          type: integer
          description: Cantidad total de productos que cumplen los filtros, en todas las páginas.
          minimum: 0
          example: 27
    Review:
      type: object
      description: Reseña aprobada de un producto.
      required: [id, authorName, rating, text, createdAt, verifiedPurchase]
      properties:
        id:
          type: string
          description: Identificador de la reseña.
          example: rev-0001
        authorName:
          type: string
          description: Nombre con el que firma la reseña.
          example: Paula N.
        rating:
          type: number
          description: Puntuación en estrellas, de 1 a 5, en pasos de media estrella.
          multipleOf: 0.5
          minimum: 1
          maximum: 5
          example: 5
        text:
          type: string
          description: Texto de la reseña.
          example: Muuu. Es el mate más lindo que tengo.
        createdAt:
          type: string
          format: date-time
          description: Fecha de la reseña, en UTC. El front la muestra en hora de Buenos Aires.
          example: '2026-08-15T15:00:00Z'
        verifiedPurchase:
          type: boolean
          description: Si la reseña es de alguien que compró el producto.
          example: true
    ReviewStats:
      type: object
      description: Estadísticas de todas las reseñas aprobadas de un producto.
      required: [average, count, distribution]
      properties:
        average:
          type: number
          description: Promedio de 0 a 5, sin redondear. Es 0 si no hay reseñas.
          minimum: 0
          maximum: 5
          example: 4.7
        count:
          type: integer
          description: Cantidad de reseñas aprobadas.
          minimum: 0
          example: 3
        distribution:
          type: array
          description: Una fila por puntuación, de 5 a 1 estrellas.
          items:
            type: object
            description: Cuántas reseñas tienen una puntuación.
            required: [stars, count, percent]
            properties:
              stars:
                type: integer
                description: Puntuación de esta fila, de 1 a 5.
                minimum: 1
                maximum: 5
                example: 5
              count:
                type: integer
                description: Cantidad de reseñas con esa puntuación.
                minimum: 0
                example: 2
              percent:
                type: integer
                description: Porcentaje sobre el total de reseñas, redondeado a entero (0 si no hay reseñas).
                minimum: 0
                maximum: 100
                example: 67
    ReviewPage:
      type: object
      description: Página de reseñas de un producto, con las estadísticas de todas.
      required: [items, page, pageSize, total, stats]
      properties:
        items:
          type: array
          description: Reseñas de la página.
          items:
            $ref: '#/components/schemas/Review'
        page:
          type: integer
          description: Número de esta página, empezando en 1.
          minimum: 1
          example: 1
        pageSize:
          type: integer
          description: Cantidad de reseñas por página que aplicó el servidor.
          minimum: 1
          maximum: 100
          example: 10
        total:
          type: integer
          description: Cantidad total de reseñas aprobadas, en todas las páginas.
          minimum: 0
          example: 3
        stats:
          $ref: '#/components/schemas/ReviewStats'
    FeaturedReview:
      description: Reseña destacada, con el producto al que pertenece.
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          required: [product]
          properties:
            product:
              type: object
              description: Producto reseñado.
              required: [slug, name]
              properties:
                slug:
                  type: string
                  description: Slug actual del producto.
                  example: mate-imperial-premium
                name:
                  type: string
                  description: Nombre del producto.
                  example: Mate Imperial Premium
    ShippingOption:
      type: object
      description: Opción de envío que se ofrece en el checkout.
      required: [method, label, costArs, eta, enabled]
      properties:
        method:
          $ref: '#/components/schemas/ShippingMethod'
        label:
          type: string
          description: Nombre que ve el cliente.
          example: Envío a domicilio
        costArs:
          description: Costo del envío en pesos; 0 si es gratis.
          $ref: '#/components/schemas/Pesos'
        eta:
          type: string
          description: Plazo estimado, en texto libre.
          example: 3 a 6 días hábiles
        enabled:
          type: boolean
          description: Si la opción está disponible para elegir.
          example: true
      example:
        method: home
        label: Envío a domicilio
        costArs: 6500
        eta: 3 a 6 días hábiles
        enabled: true
    PublicSettings:
      type: object
      description: Ajustes que necesita la tienda para mostrarse y calcular importes.
      required:
        - kitDiscountPercent
        - shippingOptions
        - installments
        - contactEmail
        - priceDisplay
        - seller
      properties:
        kitDiscountPercent:
          type: integer
          description: Porcentaje de descuento del kit (mate, bombilla y yerba), de 0 a 30.
          minimum: 0
          maximum: 30
          example: 10
        shippingOptions:
          type: array
          description: Las 3 opciones de envío, una por método.
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/ShippingOption'
        installments:
          type: object
          description: Cuotas sin interés.
          required: [maxWithoutInterest, showOnProduct]
          properties:
            maxWithoutInterest:
              type: integer
              description: Máximo de cuotas sin interés, de 1 a 12.
              minimum: 1
              maximum: 12
              example: 3
            showOnProduct:
              type: boolean
              description: Si la ficha del producto muestra las cuotas.
              example: true
        contactEmail:
          type: string
          format: email
          description: Mail de contacto de la tienda.
          example: galpon.mates@gmail.com
        priceDisplay:
          type: object
          description: Cómo se muestran los precios.
          required: [showNetPrice]
          properties:
            showNetPrice:
              type: boolean
              description: Si se muestra debajo del precio el "Precio sin impuestos nacionales" (Ley 27.743).
              example: true
        seller:
          type: object
          description: Datos del vendedor que la tienda tiene que mostrar (Disp. 954/2025). Cada dato es `null` mientras no se cargue.
          required:
            - legalName
            - cuit
            - taxCondition
            - address
            - phone
            - supportArea
            - supportHours
            - dataFiscalUrl
          properties:
            legalName:
              type: [string, 'null']
              description: Razón social o nombre completo.
              maxLength: 120
              example: Galpón Mates S. R. L.
            cuit:
              type: [string, 'null']
              description: CUIT, con los 11 dígitos pegados y el dígito verificador correcto.
              pattern: '^[0-9]{11}$'
              example: '30712345671'
            taxCondition:
              type: [string, 'null']
              description: Condición frente al IVA.
              maxLength: 60
              example: Responsable inscripto
            address:
              type: [string, 'null']
              description: Domicilio del vendedor.
              maxLength: 200
              example: Av. Siempreviva 742, Neuquén
            phone:
              type: [string, 'null']
              description: Teléfono o canal alternativo de atención.
              maxLength: 60
              example: '+54 9 299 123 4567'
            supportArea:
              type: [string, 'null']
              description: Área responsable de la atención.
              maxLength: 80
              example: Atención al cliente
            supportHours:
              type: [string, 'null']
              description: Horario de atención.
              maxLength: 120
              example: Lunes a viernes de 9 a 18
            dataFiscalUrl:
              type: [string, 'null']
              format: uri
              maxLength: 2048
              pattern: '^https?://'
              description: Enlace a Data Fiscal (ARCA), con http o https.
              example: https://example.com/data-fiscal
    SectionHeading:
      type: object
      description: Encabezado de una sección del inicio.
      required: [eyebrow, title]
      properties:
        eyebrow:
          type: string
          maxLength: 60
          description: Texto corto que va arriba del título, hasta 60 caracteres.
          example: Destacados
        title:
          type: string
          maxLength: 60
          description: Título de la sección, hasta 60 caracteres.
          example: Los más elegidos de la ronda
      example:
        eyebrow: Destacados
        title: Los más elegidos de la ronda
    StoryScene:
      type: object
      description: Escena de la historia que se cuenta al bajar por el inicio.
      required: [key, eyebrow, titleLines, text, ctaLabel]
      properties:
        key:
          type: string
          description: Escena a la que corresponde el texto. Cada una aparece una sola vez.
          enum: [pieces, gourd, bombilla, yerba, ritual, leather]
          example: gourd
        eyebrow:
          type: string
          maxLength: 60
          description: Texto corto que va arriba del título, hasta 60 caracteres.
          example: Mate
        titleLines:
          type: array
          description: Líneas del título, una debajo de la otra; de 1 a 3, de hasta 60 caracteres cada una.
          minItems: 1
          maxItems: 3
          items:
            type: string
            maxLength: 60
          example: [Calabaza curada., Virola de alpaca.]
        text:
          type: string
          maxLength: 600
          description: Texto de la escena, hasta 600 caracteres.
          example: Cada calabaza se elige por su forma y sus paredes. La virola se cincela a mano y la base de bronce lo mantiene firme sobre la mesa.
        ctaLabel:
          type: [string, 'null']
          maxLength: 40
          description: Texto del botón de la escena (hasta 40 caracteres), o `null` si la escena no tiene botón.
          example: Ver mates
    HomeContent:
      type: object
      description: >-
        Textos editables de la página de inicio. Los límites son los de `homeContentFormSchema`
        de `@galpon/schemas`: los textos se recortan y los obligatorios no pueden quedar vacíos.
      required:
        - hero
        - scenes
        - ritualSteps
        - storyProducts
        - collection
        - featured
        - reviews
        - manifesto
        - stats
        - kitBlock
      properties:
        hero:
          type: object
          description: Portada del inicio.
          required: [eyebrow, titleLines, text, primaryCtaLabel, secondaryCtaLabel]
          properties:
            eyebrow:
              type: string
              maxLength: 60
              description: Texto corto que va arriba del título, hasta 60 caracteres.
              example: Hechos para compartir
            titleLines:
              type: array
              description: Líneas del título, una debajo de la otra; de 1 a 3, de hasta 60 caracteres cada una.
              minItems: 1
              maxItems: 3
              items:
                type: string
                maxLength: 60
              example: [Encontrá, tu mate.]
            text:
              type: string
              maxLength: 600
              description: Texto debajo del título, hasta 600 caracteres.
              example: Calabaza curada, virola de alpaca cincelada y bombillones de bronce. Bajá, que te mostramos cada pieza de cerca.
            primaryCtaLabel:
              type: string
              maxLength: 40
              description: Texto del botón principal, hasta 40 caracteres.
              example: Ver la tienda
            secondaryCtaLabel:
              type: string
              maxLength: 40
              description: Texto del botón secundario, hasta 40 caracteres.
              example: Armá tu kit
        scenes:
          type: array
          description: Las 6 escenas de la historia, en el orden en que se muestran; cada `key` aparece una sola vez.
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/StoryScene'
        ritualSteps:
          type: array
          description: Los 4 pasos del ritual, en orden, de hasta 80 caracteres cada uno.
          minItems: 4
          maxItems: 4
          items:
            type: string
            maxLength: 80
          example: [Yerba, Montañita, Bombilla, Agua]
        storyProducts:
          type: object
          description: Slugs de los productos que se muestran en la historia.
          required: [hero, bombillas, yerbas]
          properties:
            hero:
              type: string
              maxLength: 80
              pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
              description: Slug del mate de la portada.
              example: mate-imperial-premium
            bombillas:
              type: array
              description: Slugs de las 2 bombillas.
              minItems: 2
              maxItems: 2
              items:
                type: string
                maxLength: 80
                pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
              example: [bombillon-premium-curvo, bombillon-100-alpaca]
            yerbas:
              type: array
              description: Slugs de las 3 yerbas.
              minItems: 3
              maxItems: 3
              items:
                type: string
                maxLength: 80
                pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
              example:
                [yerba-canarias-1-kg, yerba-canarias-serena-1-kg, yerba-canarias-te-y-jengibre-1-kg]
        collection:
          description: Encabezado de la sección de líneas.
          $ref: '#/components/schemas/SectionHeading'
        featured:
          description: Encabezado de la sección de destacados.
          $ref: '#/components/schemas/SectionHeading'
        reviews:
          description: Encabezado de la sección de reseñas.
          $ref: '#/components/schemas/SectionHeading'
        manifesto:
          type: object
          description: Frase del manifiesto.
          required: [eyebrow, text, ctaLabel]
          properties:
            eyebrow:
              type: string
              maxLength: 60
              description: Texto corto que va arriba de la frase, hasta 60 caracteres.
              example: Manifiesto
            text:
              type: string
              maxLength: 400
              description: Frase del manifiesto, hasta 400 caracteres.
              example: Un mate no se compra, se elige. Calabaza curada, alpaca cincelada a mano y cuero cosido punto por punto. Piezas hechas para durar muchas rondas.
            ctaLabel:
              type: string
              maxLength: 40
              description: Texto del enlace a Nosotros, hasta 40 caracteres.
              example: Conocé la historia del galpón
        stats:
          type: object
          description: Cifras editables que se muestran junto al manifiesto.
          required: [provinces, partners]
          properties:
            provinces:
              type: integer
              description: Cantidad de provincias con envío, de 0 a 999.
              minimum: 0
              maximum: 999
              example: 24
            partners:
              type: integer
              description: Cantidad de socios, de 0 a 999.
              minimum: 0
              maximum: 999
              example: 2
        kitBlock:
          type: object
          description: Bloque que invita a armar el kit.
          required: [eyebrow, title, text, ctaLabel]
          properties:
            eyebrow:
              type: string
              maxLength: 60
              description: Texto corto que va arriba del título, hasta 60 caracteres.
              example: Armá tu kit
            title:
              type: string
              maxLength: 60
              description: Título del bloque, hasta 60 caracteres.
              example: Mate, bombilla y yerba.
            text:
              type: string
              maxLength: 600
              description: Texto del bloque, hasta 600 caracteres.
              example: Elegí las tres piezas en tres pasos. El descuento se aplica solo sobre el total del kit.
            ctaLabel:
              type: string
              maxLength: 40
              description: Texto del botón, hasta 40 caracteres.
              example: Armar mi kit
    AboutContent:
      type: object
      description: >-
        Textos editables de la página Nosotros. Los límites son los de `aboutContentFormSchema`
        de `@galpon/schemas`: los textos se recortan y los obligatorios no pueden quedar vacíos.
      required: [hero, partners, quote, stepsEyebrow, steps, ctaLabel]
      properties:
        hero:
          type: object
          description: Portada de la página.
          required: [eyebrow, titleLines, text]
          properties:
            eyebrow:
              type: string
              maxLength: 60
              description: Texto corto que va arriba del título, hasta 60 caracteres.
              example: Sobre nosotros
            titleLines:
              type: array
              description: Líneas del título, una debajo de la otra; de 1 a 3, de hasta 60 caracteres cada una.
              minItems: 1
              maxItems: 3
              items:
                type: string
                maxLength: 60
              example: [Dos socios., Un galpón., La ronda de siempre.]
            text:
              type: string
              maxLength: 600
              description: Texto debajo del título, hasta 600 caracteres.
              example: Galpón nació entre dos socios que compartían la misma costumbre, un buen mate al lado. Hoy elegimos cada pieza, la revisamos a mano y la mandamos a todo el país.
        partners:
          type: array
          description: Socios, con su foto; hasta 8.
          maxItems: 8
          items:
            type: object
            description: Socio del galpón.
            required: [name, role, photo]
            properties:
              name:
                type: string
                maxLength: 60
                description: Nombre del socio, hasta 60 caracteres.
                example: Bruno Galimberti
              role:
                type: string
                maxLength: 80
                description: Rol del socio, hasta 80 caracteres.
                example: Socio fundador
              photo:
                description: Foto del socio, o `null` si todavía no hay.
                oneOf:
                  - $ref: '#/components/schemas/Image'
                  - type: 'null'
        quote:
          type: string
          maxLength: 300
          description: Frase destacada de la página, hasta 300 caracteres.
          example: No vendemos lo que no usaríamos. Cada mate pasa por nuestras manos antes de llegar a las tuyas.
        stepsEyebrow:
          type: string
          maxLength: 60
          description: Texto corto que va arriba de los pasos, hasta 60 caracteres.
          example: Cómo trabajamos
        steps:
          type: array
          description: Los 3 pasos de cómo trabaja el galpón.
          minItems: 3
          maxItems: 3
          items:
            type: object
            description: Paso de trabajo.
            required: [title, text]
            properties:
              title:
                type: string
                maxLength: 60
                description: Título del paso, hasta 60 caracteres.
                example: Elegimos cada calabaza
              text:
                type: string
                maxLength: 400
                description: Texto del paso, hasta 400 caracteres.
                example: Buscamos formas parejas, paredes firmes y buena boca. Si no pasa la revisión, no sale.
        ctaLabel:
          type: string
          maxLength: 40
          description: Texto del botón que lleva a la tienda, hasta 40 caracteres.
          example: Conocé la tienda
    AboutContentInput:
      type: object
      description: >-
        Textos de Nosotros que guarda el dashboard: lo mismo que `AboutContent`, con la foto de
        cada socio como `ImageInput` (el back arma la `url` desde `publicId`, como en productos y
        líneas). Los límites son los de `aboutContentFormSchema` de `@galpon/schemas`.
      required: [hero, partners, quote, stepsEyebrow, steps, ctaLabel]
      properties:
        hero:
          type: object
          description: Portada de la página.
          required: [eyebrow, titleLines, text]
          properties:
            eyebrow:
              type: string
              maxLength: 60
              description: Texto corto que va arriba del título, hasta 60 caracteres.
              example: Sobre nosotros
            titleLines:
              type: array
              description: Líneas del título, una debajo de la otra; de 1 a 3, de hasta 60 caracteres cada una.
              minItems: 1
              maxItems: 3
              items:
                type: string
                maxLength: 60
              example: [Dos socios., Un galpón., La ronda de siempre.]
            text:
              type: string
              maxLength: 600
              description: Texto debajo del título, hasta 600 caracteres.
              example: Galpón nació entre dos socios que compartían la misma costumbre, un buen mate al lado.
        partners:
          type: array
          description: Socios, con su foto; hasta 8.
          maxItems: 8
          items:
            type: object
            description: Socio del galpón.
            required: [name, role, photo]
            properties:
              name:
                type: string
                maxLength: 60
                description: Nombre del socio, hasta 60 caracteres.
                example: Bruno Galimberti
              role:
                type: string
                maxLength: 80
                description: Rol del socio, hasta 80 caracteres.
                example: Socio fundador
              photo:
                description: Foto ya subida del socio, o `null` si no tiene.
                oneOf:
                  - $ref: '#/components/schemas/ImageInput'
                  - type: 'null'
        quote:
          type: string
          maxLength: 300
          description: Frase destacada de la página, hasta 300 caracteres.
          example: No vendemos lo que no usaríamos.
        stepsEyebrow:
          type: string
          maxLength: 60
          description: Texto corto que va arriba de los pasos, hasta 60 caracteres.
          example: Cómo trabajamos
        steps:
          type: array
          description: Los 3 pasos de cómo trabaja el galpón.
          minItems: 3
          maxItems: 3
          items:
            type: object
            description: Paso de trabajo.
            required: [title, text]
            properties:
              title:
                type: string
                maxLength: 60
                description: Título del paso, hasta 60 caracteres.
                example: Elegimos cada calabaza
              text:
                type: string
                maxLength: 400
                description: Texto del paso, hasta 400 caracteres.
                example: Buscamos formas parejas, paredes firmes y buena boca.
        ctaLabel:
          type: string
          maxLength: 40
          description: Texto del botón que lleva a la tienda, hasta 40 caracteres.
          example: Conocé la tienda
    FaqContent:
      type: object
      description: >-
        Preguntas frecuentes, agrupadas por categoría. Los límites son los de
        `faqContentFormSchema` de `@galpon/schemas`.
      required: [categories]
      properties:
        categories:
          type: array
          description: Categorías de preguntas, en el orden en que se muestran; de 1 a 10.
          minItems: 1
          maxItems: 10
          items:
            type: object
            description: Categoría de preguntas.
            required: [id, label, items]
            properties:
              id:
                type: string
                maxLength: 80
                pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
                description: Identificador de la categoría, usado en la dirección web. Minúsculas, números y guiones.
                example: envios
              label:
                type: string
                maxLength: 40
                description: Nombre de la categoría, hasta 40 caracteres.
                example: Envíos
              items:
                type: array
                description: Preguntas de la categoría, de 1 a 30.
                minItems: 1
                maxItems: 30
                items:
                  type: object
                  description: Pregunta con su respuesta.
                  required: [question, answer]
                  properties:
                    question:
                      type: string
                      maxLength: 200
                      description: Pregunta, hasta 200 caracteres.
                      example: ¿Hacen envíos a todo el país?
                    answer:
                      type: string
                      maxLength: 2000
                      description: Respuesta, hasta 2000 caracteres.
                      example: Sí, enviamos a las 24 provincias. Podés elegir envío a domicilio o a sucursal.
    FooterContent:
      type: object
      description: >-
        Textos editables del pie de página. Los límites son los de `footerContentFormSchema` de
        `@galpon/schemas`.
      required: [tagline, text, paymentMethods, consumerDefenseUrl]
      properties:
        tagline:
          type: string
          maxLength: 80
          description: Frase del pie, hasta 80 caracteres.
          example: Hechos para compartir.
        text:
          type: string
          maxLength: 300
          description: Texto debajo de la frase, hasta 300 caracteres.
          example: Mates, bombillones y yerba con envío a todo el país.
        paymentMethods:
          type: array
          description: Nombres de los medios de pago que se muestran; hasta 10, de hasta 40 caracteres.
          maxItems: 10
          items:
            type: string
            maxLength: 40
          example: [Mercado Pago, Visa, Mastercard, American Express]
        consumerDefenseUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https?://'
          description: Enlace a Defensa del Consumidor (http o https), o `null` si no se muestra.
          example: https://www.argentina.gob.ar/produccion/defensadelconsumidor
      example:
        tagline: Hechos para compartir.
        text: Mates, bombillones y yerba con envío a todo el país.
        paymentMethods: [Mercado Pago, Visa, Mastercard, American Express]
        consumerDefenseUrl: null
    ProductTabsGroupContent:
      type: object
      description: Textos de las pestañas de la ficha para un grupo de producto.
      required: [descriptionNote, materialsTitle, materials, careTitle, care]
      properties:
        descriptionNote:
          type: [string, 'null']
          maxLength: 600
          description: Nota que se muestra debajo de la descripción (hasta 600 caracteres), o `null` si el grupo no tiene.
          example: Cada pieza es artesanal, así que los tonos de la calabaza, el cuero y el cincelado pueden variar.
        materialsTitle:
          type: string
          maxLength: 30
          description: Título de la pestaña de materiales ("Materiales" o "Contenido"), hasta 30 caracteres.
          example: Materiales
        materials:
          type: string
          maxLength: 2000
          description: Texto de la pestaña de materiales, hasta 2000 caracteres.
          example: Calabaza natural curable, virola de alpaca o acero según variante y cuero vacuno cosido a mano.
        careTitle:
          type: string
          maxLength: 30
          description: Título de la pestaña de cuidado ("Cuidado" o "Conservación"), hasta 30 caracteres.
          example: Cuidado
        care:
          type: string
          maxLength: 2000
          description: Texto de la pestaña de cuidado, hasta 2000 caracteres.
          example: Curalo antes del primer uso y secalo boca abajo después de cada ronda.
    ProductTabsContent:
      type: object
      description: >-
        Textos de fábrica de las pestañas de la ficha, por grupo de producto, más el de envío y
        cambios, que es común. Los límites son los de `productTabsContentFormSchema` de
        `@galpon/schemas`.
      required: [mate, bombilla, yerba, shipping]
      properties:
        mate:
          $ref: '#/components/schemas/ProductTabsGroupContent'
        bombilla:
          $ref: '#/components/schemas/ProductTabsGroupContent'
        yerba:
          $ref: '#/components/schemas/ProductTabsGroupContent'
        shipping:
          type: string
          maxLength: 2000
          description: Texto de la pestaña de envío y cambios, igual para todos los grupos; hasta 2000 caracteres.
          example: Enviamos a todo el país y calculás el costo en el checkout. También podés retirar sin costo. Tenés 10 días desde que lo recibís para cambios o arrepentimiento.
    LegalContent:
      type: object
      description: >-
        Documento legal (términos y condiciones o política de privacidad). Los límites son los de
        `legalContentFormSchema` de `@galpon/schemas`.
      required: [title, updatedAt, body]
      properties:
        title:
          type: string
          maxLength: 120
          description: Título del documento, hasta 120 caracteres.
          example: Términos y condiciones
        updatedAt:
          type: string
          format: date
          description: Fecha de la última actualización.
          example: '2026-10-01'
        body:
          type: string
          minLength: 1
          maxLength: 60000
          description: Texto del documento, con los párrafos separados por una línea en blanco; de 1 a 60.000 caracteres.
          example: "Texto de ejemplo. Reemplazar por el texto revisado por un profesional antes de publicar.\n\nSegundo párrafo."
    OrderStatus:
      type: string
      description: >-
        Estado de un pedido. El ciclo normal es `pending_payment` (espera el pago, con el stock
        reservado), `paid`, `preparing`, `shipped` y `delivered`. Los finales alternativos son
        `cancelled`, `expired` (venció la reserva sin pago) y `refunded`.
      enum:
        - pending_payment
        - paid
        - preparing
        - shipped
        - delivered
        - cancelled
        - expired
        - refunded
      example: paid
    PaymentStatus:
      type: string
      description: >-
        Estado del pago de un pedido, ya traducido por el back desde los estados de Mercado Pago.
        `none` es que todavía no hay ningún intento y `action_required` que falta la verificación
        3-D Secure. `refunded` y `partially_refunded` son las devoluciones, `in_dispute` una
        mediación abierta y `charged_back` un contracargo.
      enum:
        - none
        - pending
        - action_required
        - approved
        - rejected
        - cancelled
        - refunded
        - partially_refunded
        - in_dispute
        - charged_back
      example: approved
    PaymentMethod:
      type: string
      description: Forma de pago elegida en el checkout. `mp_redirect` lleva al cliente a Mercado Pago y `card` cobra con tarjeta dentro de la tienda.
      enum: [mp_redirect, card]
      example: mp_redirect
    Province:
      type: string
      description: Provincia o jurisdicción de entrega (las 24 del selector, con CABA).
      enum:
        - Buenos Aires
        - CABA
        - Catamarca
        - Chaco
        - Chubut
        - Córdoba
        - Corrientes
        - Entre Ríos
        - Formosa
        - Jujuy
        - La Pampa
        - La Rioja
        - Mendoza
        - Misiones
        - Neuquén
        - Río Negro
        - Salta
        - San Juan
        - San Luis
        - Santa Cruz
        - Santa Fe
        - Santiago del Estero
        - Tierra del Fuego
        - Tucumán
      example: Neuquén
    ContactReason:
      type: string
      description: Motivo de un mensaje de contacto.
      enum: [Pedido, Envío, Cambio, Arrepentimiento, Otro]
      example: Pedido
    LineType:
      type: string
      description: Tipo de línea del carrito o del pedido. `product` es un producto suelto y `kit` es un kit de mate, bombilla y yerba con descuento.
      enum: [product, kit]
      example: product
    Email:
      type: string
      format: email
      maxLength: 254
      description: Email. El back lo guarda en minúsculas y sin espacios alrededor.
      example: vos@ejemplo.com
    PersonName:
      type: string
      minLength: 2
      maxLength: 50
      pattern: "^\\p{L}[\\p{L}\\p{M} '’-]*$"
      description: Nombre o apellido de una persona, de 2 a 50 caracteres. Solo letras (con acentos y ñ), espacios, apóstrofo y guion.
      example: Lucía
    Phone:
      type: string
      pattern: '^[1-9][0-9]{9}$'
      description: Teléfono argentino de 10 dígitos, con el código de área y sin 0, 15 ni +54. La tienda lo normaliza antes de enviarlo.
      example: '1123456789'
    PostalCode:
      type: string
      pattern: '^[A-Za-z]?[0-9]{4}[A-Za-z]{0,3}$'
      description: Código postal argentino, como `1414`, `B1900` o `C1414ABC`. El back lo guarda en mayúsculas.
      example: C1414
    OrderNumber:
      type: string
      pattern: '^GLP-[0-9]{5}$'
      description: Número de pedido, `GLP-` y cinco dígitos.
      example: GLP-12345
    Password:
      type: string
      minLength: 10
      maxLength: 128
      pattern: '^(?=.*\p{L})(?=.*[0-9])'
      description: Contraseña nueva, de 10 a 128 caracteres y con al menos una letra y un número.
      example: mate-con-yerba-2026
    Honeypot:
      type: [string, 'null']
      description: >-
        Campo trampa contra bots. Las personas no lo ven y lo dejan vacío (`null` o `""`). Si
        llega con texto, el back descarta el envío en silencio: responde como si hubiera
        funcionado y no guarda nada.
      example: null
    CartItemOptions:
      type: object
      description: Opciones elegidas de un mate. No cambian el precio.
      required: [leather, ferrule]
      properties:
        leather:
          $ref: '#/components/schemas/Leather'
        ferrule:
          $ref: '#/components/schemas/Ferrule'
    ProductCartItemInput:
      type: object
      description: Producto suelto en el carrito.
      required: [type, productId, quantity, options]
      properties:
        type:
          type: string
          const: product
          description: Discriminador; en un producto suelto vale `product`.
          example: product
        productId:
          type: string
          minLength: 1
          maxLength: 80
          description: Identificador del producto.
          example: prd-imperial-premium
        quantity:
          type: integer
          minimum: 1
          maximum: 20
          description: Unidades, de 1 a 20 (y no más que el stock).
          example: 1
        options:
          description: Cuero y virola elegidos; `null` en los productos que no son mates.
          oneOf:
            - $ref: '#/components/schemas/CartItemOptions'
            - type: 'null'
        expectedUnitPriceArs:
          description: >-
            Precio de lista por unidad que la tienda tenía cotizado. Es opcional: si viene y no
            coincide con el vigente, la línea de `POST /cart/quote` sale con `issue`
            `price_changed` y `POST /orders` responde `409` con `type` `price_changed` y no crea
            nada. Sin este campo, un cambio de precio solo se nota como `total_changed`. Si a la
            vez bajó el stock, gana el stock: la línea sale con `quantity_reduced` y `POST /orders`
            responde `stock_changed`.
          $ref: '#/components/schemas/Pesos'
    KitCartItemInput:
      type: object
      description: Kit de mate, bombilla y yerba, con el descuento del kit.
      required: [type, mateId, bombillaId, yerbaId, leather, quantity]
      properties:
        type:
          type: string
          const: kit
          description: Discriminador; en un kit vale `kit`.
          example: kit
        mateId:
          type: string
          minLength: 1
          maxLength: 80
          description: Identificador del mate del kit.
          example: prd-imperial-premium
        bombillaId:
          type: string
          minLength: 1
          maxLength: 80
          description: Identificador de la bombilla del kit.
          example: prd-bombillon-premium-curvo
        yerbaId:
          type: string
          minLength: 1
          maxLength: 80
          description: Identificador de la yerba del kit.
          example: prd-yerba-canarias-1-kg
        leather:
          $ref: '#/components/schemas/Leather'
        quantity:
          type: integer
          minimum: 1
          maximum: 20
          description: Cantidad de kits, de 1 a 20 (y no más que el stock de cada pieza).
          example: 1
        expectedUnitPriceArs:
          description: >-
            Precio de lista por unidad que la tienda tenía cotizado (la suma de las tres piezas,
            sin el descuento del kit). Es opcional: si viene y no coincide con el vigente, la
            línea de `POST /cart/quote` sale con `issue` `price_changed` y `POST /orders` responde
            `409` con `type` `price_changed` y no crea nada. Sin este campo, un cambio de precio
            solo se nota como `total_changed`. Si a la vez bajó el stock, gana el stock: la línea
            sale con `quantity_reduced` y `POST /orders` responde `stock_changed`.
          $ref: '#/components/schemas/TotalArs'
    CartItemInput:
      description: Línea del carrito que se envía al back. El campo `type` dice si es un producto suelto o un kit.
      oneOf:
        - $ref: '#/components/schemas/ProductCartItemInput'
        - $ref: '#/components/schemas/KitCartItemInput'
      discriminator:
        propertyName: type
        mapping:
          product: '#/components/schemas/ProductCartItemInput'
          kit: '#/components/schemas/KitCartItemInput'
    CartQuoteInput:
      type: object
      description: Carrito a cotizar.
      required: [items]
      properties:
        items:
          type: array
          description: Líneas del carrito.
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CartItemInput'
      example:
        items:
          - type: product
            productId: prd-imperial-premium
            quantity: 1
            options:
              leather: Negro
              ferrule: Alpaca cincelada
    CartQuoteLine:
      type: object
      description: >-
        Línea cotizada. `unitPriceArs` es el precio de lista de una unidad (en un kit, la suma de
        las tres piezas), `kitSavingsArs` es el ahorro de toda la línea y
        `totalArs = unitPriceArs × cantidad − kitSavingsArs`. Las líneas `unavailable` y
        `sold_out` tienen todos sus importes en 0 y no suman a los totales.
      required:
        - key
        - type
        - name
        - detail
        - unitPriceArs
        - netUnitPriceArs
        - kitSavingsArs
        - totalArs
        - maxQuantity
        - issue
      properties:
        key:
          type: string
          description: >-
            Clave de la línea, igual a la que arma la tienda: `product:{productId}:{cuero}:{virola}`
            (con `-` si no hay opciones) o `kit:{mateId}:{bombillaId}:{yerbaId}:{cuero}`.
          example: product:prd-imperial-premium:Negro:Alpaca cincelada
        type:
          $ref: '#/components/schemas/LineType'
        name:
          type: string
          description: Nombre de la línea, es decir el del producto o "Kit".
          example: Mate Imperial Premium
        detail:
          type: string
          description: Texto secundario de la línea, con las opciones elegidas; vacío si no hay.
          example: Cuero Negro · Virola Alpaca cincelada
        unitPriceArs:
          description: Precio de lista de una unidad (en un kit, la suma de las tres piezas).
          $ref: '#/components/schemas/TotalArs'
        netUnitPriceArs:
          description: >-
            Precio sin impuestos nacionales (Ley 27.743) de una unidad, calculado por el back con
            la alícuota configurada en los ajustes sobre el precio de venta efectivo por unidad,
            es decir `(unitPriceArs × cantidad − kitSavingsArs) / cantidad`, que es lo mismo que
            `totalArs / cantidad` (la división es exacta porque el ahorro por kit es proporcional
            a la cantidad). En un kit con descuento es el neto de lo que paga el cliente y no el
            del precio de lista; en los productos sueltos coincide con el neto de `unitPriceArs`.
            Sirve para mostrar "Precio sin impuestos nacionales" también en los kits, junto a
            `totalArs`, sin que la tienda lo recalcule. Vale `null` si
            `PublicSettings.priceDisplay.showNetPrice` está apagado; en las líneas `unavailable`
            y `sold_out` vale 0, como los demás importes.
          oneOf:
            - $ref: '#/components/schemas/TotalArs'
            - type: 'null'
        kitSavingsArs:
          description: Ahorro por kit de toda la línea; 0 en los productos sueltos.
          $ref: '#/components/schemas/TotalArs'
        totalArs:
          description: Importe de la línea, ya sin el ahorro.
          $ref: '#/components/schemas/TotalArs'
        maxQuantity:
          type: integer
          description: Cantidad máxima que se puede pedir de esta línea, es decir el menor entre 20 y el stock de sus piezas (0 si no hay).
          minimum: 0
          maximum: 20
          example: 12
        issue:
          description: >-
            Problema de la línea, o `null` si está bien. `unavailable`: el producto ya no está
            publicado o no tiene precio. `sold_out`: no queda stock. `quantity_reduced`: había
            menos stock que lo pedido y la línea se cotizó con `maxQuantity` unidades.
            `price_changed`: el precio cambió respecto de `expectedUnitPriceArs`, que la tienda
            mandó en la línea, y los importes ya son los vigentes.
          type: [string, 'null']
          enum: [unavailable, sold_out, quantity_reduced, price_changed, null]
          example: null
    CartQuote:
      type: object
      description: >-
        Cotización del carrito. `subtotalArs = itemsGrossArs − kitSavingsArs`. No incluye el
        envío.
      required: [lines, itemsGrossArs, kitSavingsArs, subtotalArs, netSubtotalArs]
      properties:
        lines:
          type: array
          description: Líneas cotizadas, en el mismo orden que el carrito enviado.
          items:
            $ref: '#/components/schemas/CartQuoteLine'
        itemsGrossArs:
          description: Suma de los precios de lista de todas las líneas.
          $ref: '#/components/schemas/TotalArs'
        kitSavingsArs:
          description: Suma de los ahorros por kit.
          $ref: '#/components/schemas/TotalArs'
        subtotalArs:
          description: Importe de las líneas sin envío, es decir el bruto menos el ahorro por kit.
          $ref: '#/components/schemas/TotalArs'
        netSubtotalArs:
          description: >-
            Precio sin impuestos nacionales (Ley 27.743) del subtotal, calculado por el back sobre
            `subtotalArs` (ya con el ahorro por kit) con la alícuota configurada en los ajustes.
            Puede diferir en algunos pesos de la suma de `netUnitPriceArs × cantidad` por el
            redondeo de cada neto. Vale `null` si `PublicSettings.priceDisplay.showNetPrice` está
            apagado.
          oneOf:
            - $ref: '#/components/schemas/TotalArs'
            - type: 'null'
      example:
        lines:
          - key: product:prd-imperial-premium:Negro:Alpaca cincelada
            type: product
            name: Mate Imperial Premium
            detail: Cuero Negro · Virola Alpaca cincelada
            unitPriceArs: 39999
            netUnitPriceArs: 33057
            kitSavingsArs: 0
            totalArs: 39999
            maxQuantity: 12
            issue: null
        itemsGrossArs: 39999
        kitSavingsArs: 0
        subtotalArs: 39999
        netSubtotalArs: 33057
    ShippingQuoteInput:
      type: object
      description: Datos para cotizar un envío.
      required: [method, postalCode, items]
      properties:
        method:
          $ref: '#/components/schemas/ShippingMethod'
        postalCode:
          description: Código postal de destino, o `null` si no corresponde (retiro en persona).
          oneOf:
            - $ref: '#/components/schemas/PostalCode'
            - type: 'null'
        items:
          type: array
          description: Líneas del carrito.
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CartItemInput'
    ShippingQuote:
      type: object
      description: Costo y plazo de un envío.
      required: [method, costArs, eta]
      properties:
        method:
          $ref: '#/components/schemas/ShippingMethod'
        costArs:
          description: Costo del envío en pesos; 0 si es gratis.
          $ref: '#/components/schemas/Pesos'
        eta:
          type: string
          description: Plazo estimado, en texto libre.
          example: 3 a 6 días hábiles
    CustomerInput:
      type: object
      description: Datos de contacto de quien compra.
      required: [email, firstName, lastName, phone]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        firstName:
          $ref: '#/components/schemas/PersonName'
        lastName:
          $ref: '#/components/schemas/PersonName'
        phone:
          description: Teléfono para el correo, o `null` si no lo cargó.
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
    AddressInput:
      type: object
      description: Dirección de entrega completa, para los envíos a domicilio.
      required: [street, number, apartment, postalCode, city, province]
      properties:
        street:
          type: string
          minLength: 2
          maxLength: 80
          description: Calle.
          example: Av. Corrientes
        number:
          type: string
          pattern: '^(?:[0-9]{1,5}|S/N)$'
          description: Número de la calle, de 1 a 5 dígitos, o `S/N` si no tiene.
          example: '1234'
        apartment:
          type: [string, 'null']
          maxLength: 10
          description: Piso o departamento, o `null` si no corresponde.
          example: 5° B
        postalCode:
          $ref: '#/components/schemas/PostalCode'
        city:
          type: string
          minLength: 2
          maxLength: 60
          description: Ciudad o localidad.
          example: CABA
        province:
          $ref: '#/components/schemas/Province'
    BranchAddressInput:
      type: object
      description: Destino de un envío a sucursal. Solo se piden el código postal, la ciudad y la provincia.
      additionalProperties: false
      required: [postalCode, city, province]
      properties:
        postalCode:
          $ref: '#/components/schemas/PostalCode'
        city:
          type: string
          minLength: 2
          maxLength: 60
          description: Ciudad o localidad.
          example: Neuquén
        province:
          $ref: '#/components/schemas/Province'
    ShippingAddress:
      description: >-
        Destino de un envío: la dirección completa (`AddressInput`) en `home` o solo el código
        postal, la ciudad y la provincia (`BranchAddressInput`) en `branch`.
      oneOf:
        - $ref: '#/components/schemas/AddressInput'
        - $ref: '#/components/schemas/BranchAddressInput'
    ShippingInput:
      type: object
      description: Envío elegido en el checkout.
      required: [method, address]
      properties:
        method:
          $ref: '#/components/schemas/ShippingMethod'
        address:
          description: >-
            Destino del envío. En `home` va la dirección completa, en `branch` solo código postal,
            ciudad y provincia y en `pickup` va `null`.
          oneOf:
            - $ref: '#/components/schemas/ShippingAddress'
            - type: 'null'
    CreateOrderInput:
      type: object
      description: >-
        Pedido que arma el checkout. El back recalcula todos los importes: `expectedTotalArs` es
        solo el total que vio el cliente, para avisarle si cambió.
      required: [customer, shipping, items, paymentMethod, expectedTotalArs, website]
      properties:
        customer:
          $ref: '#/components/schemas/CustomerInput'
        shipping:
          $ref: '#/components/schemas/ShippingInput'
        items:
          type: array
          description: Líneas del carrito.
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CartItemInput'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        expectedTotalArs:
          description: Total que el cliente vio en el resumen, con el envío incluido.
          $ref: '#/components/schemas/TotalArs'
        website:
          $ref: '#/components/schemas/Honeypot'
      example:
        customer:
          email: vos@ejemplo.com
          firstName: Lucía
          lastName: Pérez
          phone: '1123456789'
        shipping:
          method: home
          address:
            street: Av. Corrientes
            number: '1234'
            apartment: 5° B
            postalCode: C1043
            city: CABA
            province: CABA
        items:
          - type: product
            productId: prd-imperial-premium
            quantity: 1
            options:
              leather: Negro
              ferrule: Alpaca cincelada
        paymentMethod: mp_redirect
        expectedTotalArs: 46499
        website: null
    OrderShipping:
      type: object
      description: Envío del pedido, con el costo y el plazo vigentes al comprar.
      required: [method, address, costArs, eta]
      properties:
        method:
          $ref: '#/components/schemas/ShippingMethod'
        address:
          description: Destino del envío, o `null` en el retiro en persona.
          oneOf:
            - $ref: '#/components/schemas/ShippingAddress'
            - type: 'null'
        costArs:
          description: Costo del envío en pesos; 0 si fue gratis.
          $ref: '#/components/schemas/Pesos'
        eta:
          type: string
          description: Plazo estimado, en texto libre.
          example: 3 a 6 días hábiles
    OrderLine:
      type: object
      description: >-
        Línea de un pedido. Es una copia de lo que se compró, con los nombres y precios del
        momento de la compra: no cambia si después se edita el producto. Los importes se calculan
        como en `CartQuoteLine`.
      required:
        - type
        - name
        - detail
        - quantity
        - unitPriceArs
        - kitSavingsArs
        - totalArs
        - productSlug
        - options
        - kitItems
      properties:
        type:
          $ref: '#/components/schemas/LineType'
        name:
          type: string
          description: Nombre de la línea, es decir el del producto o "Kit".
          example: Mate Imperial Premium
        detail:
          type: string
          description: Texto secundario de la línea, con las opciones elegidas; vacío si no hay.
          example: Cuero Negro · Virola Alpaca cincelada
        quantity:
          type: integer
          description: Unidades compradas.
          minimum: 1
          maximum: 20
          example: 1
        unitPriceArs:
          description: Precio de lista de una unidad (en un kit, la suma de las tres piezas).
          $ref: '#/components/schemas/TotalArs'
        kitSavingsArs:
          description: Ahorro por kit de toda la línea; 0 en los productos sueltos.
          $ref: '#/components/schemas/TotalArs'
        totalArs:
          description: Importe de la línea, ya sin el ahorro.
          $ref: '#/components/schemas/TotalArs'
        productSlug:
          type: [string, 'null']
          description: Slug del producto al comprar, o `null` en un kit.
          example: mate-imperial-premium
        options:
          description: Cuero y virola de un mate o, en un kit, el cuero y la virola fija del kit. `null` en los demás productos.
          oneOf:
            - $ref: '#/components/schemas/CartItemOptions'
            - type: 'null'
        kitItems:
          type: [array, 'null']
          description: Las tres piezas de un kit (mate, bombilla y yerba), o `null` si no es un kit.
          minItems: 3
          maxItems: 3
          items:
            type: object
            description: Pieza de un kit, con su precio de lista.
            required: [slug, name, unitPriceArs]
            properties:
              slug:
                type: string
                description: Slug de la pieza al comprar.
                example: mate-imperial-premium
              name:
                type: string
                description: Nombre de la pieza.
                example: Mate Imperial Premium
              unitPriceArs:
                description: Precio de lista de la pieza.
                $ref: '#/components/schemas/Pesos'
    OrderPayment:
      type: object
      description: Pago del pedido. Salvo `method`, cada dato es `null` hasta que hay un intento de pago que lo informe.
      required:
        [method, installments, paymentTypeId, lastFour, statusDetail, mpPaymentId, challenge]
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        installments:
          type: [integer, 'null']
          description: Cantidad de cuotas del pago.
          minimum: 1
          maximum: 24
          example: 3
        paymentTypeId:
          type: [string, 'null']
          description: Tipo de medio de pago según Mercado Pago, por ejemplo `credit_card`, `debit_card` o `account_money`.
          example: credit_card
        lastFour:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
          description: Últimos 4 dígitos de la tarjeta.
          example: '4242'
        statusDetail:
          type: [string, 'null']
          description: Detalle del estado que informa Mercado Pago, por ejemplo `accredited` o `cc_rejected_insufficient_amount`. El front lo traduce a un motivo legible.
          example: accredited
        mpPaymentId:
          type: [string, 'null']
          description: Identificador del pago en Mercado Pago.
          example: '1234567890'
        challenge:
          description: >-
            Verificación 3-D Secure pendiente del intento de pago activo, para retomarla desde
            cualquier pestaña, o `null` si el pago no está en `action_required`. Es la misma que
            devolvió `POST /orders/{number}/payments/mercadopago/card` (`CardPaymentResult.challenge`)
            para ese intento: el back la guarda con el intento y deja de mandarla cuando el pago
            se resuelve o se inicia otro intento.
          oneOf:
            - $ref: '#/components/schemas/PaymentChallenge'
            - type: 'null'
    OrderTracking:
      type: object
      description: Datos del despacho, una vez que el pedido se envió.
      required: [carrier, number]
      properties:
        carrier:
          type: string
          description: Empresa de transporte.
          minLength: 2
          maxLength: 40
          example: Andreani
        number:
          type: string
          description: Número de seguimiento.
          minLength: 4
          maxLength: 40
          example: AND123456789
    OrderHistoryEntry:
      type: object
      description: Cambio de estado de un pedido.
      required: [status, at, note]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        at:
          type: string
          format: date-time
          description: Momento del cambio, en UTC.
          example: '2026-10-20T15:02:10Z'
        note:
          type: [string, 'null']
          description: Nota del cambio, o `null` si no tiene.
          example: null
    Order:
      type: object
      description: >-
        Pedido. Los importes cumplen `subtotalArs = itemsGrossArs − kitSavingsArs` y
        `totalArs = subtotalArs + shippingArs`. El pedido pasa a pagado cuando el back recibe la
        notificación de Mercado Pago, no antes.
      required:
        - number
        - status
        - paymentStatus
        - customer
        - shipping
        - lines
        - itemsGrossArs
        - kitSavingsArs
        - subtotalArs
        - shippingArs
        - totalArs
        - payment
        - tracking
        - history
        - reservedUntil
        - createdAt
      properties:
        number:
          $ref: '#/components/schemas/OrderNumber'
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        customer:
          $ref: '#/components/schemas/Customer'
        shipping:
          $ref: '#/components/schemas/OrderShipping'
        lines:
          type: array
          description: Líneas del pedido.
          items:
            $ref: '#/components/schemas/OrderLine'
        itemsGrossArs:
          description: Suma de los precios de lista de todas las líneas.
          $ref: '#/components/schemas/TotalArs'
        kitSavingsArs:
          description: Suma de los ahorros por kit.
          $ref: '#/components/schemas/TotalArs'
        subtotalArs:
          description: Importe de las líneas sin envío.
          $ref: '#/components/schemas/TotalArs'
        shippingArs:
          description: Costo del envío.
          $ref: '#/components/schemas/Pesos'
        totalArs:
          description: Total del pedido, con el envío incluido.
          $ref: '#/components/schemas/TotalArs'
        payment:
          $ref: '#/components/schemas/OrderPayment'
        tracking:
          description: Datos del despacho, o `null` mientras el pedido no se envió.
          oneOf:
            - $ref: '#/components/schemas/OrderTracking'
            - type: 'null'
        history:
          type: array
          description: Cambios de estado del pedido, del más viejo al más nuevo.
          items:
            $ref: '#/components/schemas/OrderHistoryEntry'
        reservedUntil:
          type: string
          format: date-time
          description: Hasta cuándo se reserva el stock mientras se espera el pago (30 minutos desde la creación), en UTC. Es también el vencimiento del pedido. Pasado ese momento sin pago, `status` pasa a `expired`. El valor no cambia cuando el pedido se paga.
          example: '2026-10-20T15:30:00Z'
        createdAt:
          type: string
          format: date-time
          description: Momento en que se creó el pedido, en UTC. El front lo muestra en hora de Buenos Aires.
          example: '2026-10-20T15:00:00Z'
      example:
        number: GLP-12345
        status: paid
        paymentStatus: approved
        customer:
          email: vos@ejemplo.com
          firstName: Lucía
          lastName: Pérez
          phone: '1123456789'
        shipping:
          method: home
          address:
            street: Av. Corrientes
            number: '1234'
            apartment: 5° B
            postalCode: C1043
            city: CABA
            province: CABA
          costArs: 6500
          eta: 3 a 6 días hábiles
        lines:
          - type: product
            name: Mate Imperial Premium
            detail: Cuero Negro · Virola Alpaca cincelada
            quantity: 1
            unitPriceArs: 39999
            kitSavingsArs: 0
            totalArs: 39999
            productSlug: mate-imperial-premium
            options:
              leather: Negro
              ferrule: Alpaca cincelada
            kitItems: null
        itemsGrossArs: 39999
        kitSavingsArs: 0
        subtotalArs: 39999
        shippingArs: 6500
        totalArs: 46499
        payment:
          method: card
          installments: 3
          paymentTypeId: credit_card
          lastFour: '4242'
          statusDetail: accredited
          mpPaymentId: '1234567890'
          challenge: null
        tracking: null
        history:
          - status: pending_payment
            at: '2026-10-20T15:00:00Z'
            note: null
          - status: paid
            at: '2026-10-20T15:02:10Z'
            note: null
        reservedUntil: '2026-10-20T15:30:00Z'
        createdAt: '2026-10-20T15:00:00Z'
    CreateOrderResult:
      type: object
      description: Pedido recién creado, con el token para consultarlo y pagarlo.
      required: [order, orderToken]
      properties:
        order:
          $ref: '#/components/schemas/Order'
        orderToken:
          type: string
          description: Token del pedido. Se entrega solo esta vez y va en la cabecera `X-Order-Token`.
          minLength: 1
          example: ot_3f2b8c1e5d4a4e7b9a601c2d3e4f5a6b
    OrderSummary:
      type: object
      description: Pedido como se muestra en el listado de "Mis pedidos".
      required: [number, createdAt, status, paymentStatus, totalArs, itemCount]
      properties:
        number:
          $ref: '#/components/schemas/OrderNumber'
        createdAt:
          type: string
          format: date-time
          description: Momento en que se creó el pedido, en UTC.
          example: '2026-10-20T15:00:00Z'
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        totalArs:
          description: Total del pedido, con el envío incluido.
          $ref: '#/components/schemas/TotalArs'
        itemCount:
          type: integer
          description: Cantidad de unidades del pedido, es decir la suma de las cantidades de sus líneas (un kit cuenta como una).
          minimum: 1
          example: 2
    OrderSummaryPage:
      type: object
      description: Página de pedidos del cliente.
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          description: Pedidos de la página.
          items:
            $ref: '#/components/schemas/OrderSummary'
        page:
          type: integer
          description: Número de esta página, empezando en 1.
          minimum: 1
          example: 1
        pageSize:
          type: integer
          description: Cantidad de pedidos por página que aplicó el servidor.
          minimum: 1
          maximum: 100
          example: 10
        total:
          type: integer
          description: Cantidad total de pedidos del cliente, en todas las páginas.
          minimum: 0
          example: 3
    MercadoPagoPreference:
      type: object
      description: Preferencia de pago creada en Mercado Pago.
      required: [initPoint]
      properties:
        initPoint:
          type: string
          format: uri
          description: Dirección de Mercado Pago a la que hay que redirigir al cliente para que pague.
          example: https://www.mercadopago.com.ar/checkout/v1/redirect?pref_id=123456789-abcd-1234
    CardPaymentInput:
      type: object
      description: >-
        Datos para cobrar con tarjeta. Los genera MercadoPago.js en el navegador; el número de la
        tarjeta, el vencimiento y el código de seguridad nunca llegan a esta API.
      required: [token, paymentMethodId, issuerId, installments, payer]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: Token de la tarjeta (`createCardToken`). Es de un solo uso, así que cada intento lleva uno nuevo.
          example: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d
        paymentMethodId:
          type: string
          minLength: 1
          maxLength: 50
          description: Marca de la tarjeta según Mercado Pago, por ejemplo `visa`, `master` o `amex`.
          example: visa
        issuerId:
          type: [string, 'null']
          minLength: 1
          maxLength: 50
          description: Banco emisor según Mercado Pago, o `null` si la tarjeta no necesita elegirlo.
          example: '310'
        installments:
          type: integer
          minimum: 1
          maximum: 24
          description: Cantidad de cuotas elegida, desde 1.
          example: 3
        payer:
          type: object
          description: Quien paga.
          required: [email, identification]
          properties:
            email:
              $ref: '#/components/schemas/Email'
            identification:
              type: object
              description: Documento de quien paga.
              required: [type, number]
              properties:
                type:
                  type: string
                  minLength: 1
                  maxLength: 20
                  description: Tipo de documento según Mercado Pago, por ejemplo `DNI`.
                  example: DNI
                number:
                  type: string
                  pattern: '^[A-Za-z0-9]{5,20}$'
                  description: Número de documento, sin puntos ni espacios.
                  example: '12345678'
    CardPaymentResult:
      type: object
      description: >-
        Resultado de un intento de pago con tarjeta. `paymentStatus` es el estado en este momento:
        el definitivo llega por la notificación de Mercado Pago.
      required: [paymentStatus, statusDetail, challenge]
      properties:
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        statusDetail:
          type: [string, 'null']
          description: Detalle del estado que informa Mercado Pago, o `null` si no hay.
          example: accredited
        challenge:
          description: Verificación 3-D Secure pendiente, o `null` si no hace falta.
          oneOf:
            - $ref: '#/components/schemas/PaymentChallenge'
            - type: 'null'
    PaymentChallenge:
      type: object
      description: Verificación 3-D Secure que el cliente completa con su banco.
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Dirección que se abre en un diálogo para que el cliente verifique la compra.
          example: https://www.mercadopago.com.ar/3ds/challenge?id=abc123
    InstallmentsInput:
      type: object
      description: >-
        Tarjeta para la que se consultan las cuotas. Solo lleva los primeros dígitos (el BIN), que
        identifican la marca y el banco pero no alcanzan para usar la tarjeta.
      required: [bin, paymentTypeId]
      properties:
        bin:
          type: string
          pattern: '^[0-9]{6,8}$'
          description: Primeros 6 a 8 dígitos del número de la tarjeta.
          example: '45031234'
        paymentTypeId:
          type: string
          enum: [credit_card, debit_card]
          description: Tipo de tarjeta según Mercado Pago. Con `debit_card` solo hay 1 pago.
          example: credit_card
      example:
        bin: '45031234'
        paymentTypeId: credit_card
    InstallmentOption:
      type: object
      description: >-
        Opción de cuotas para una tarjeta. `totalArs` es lo que se paga en total con esa cantidad
        de cuotas: es igual al total del pedido si `cftPercent` es 0 y mayor si hay costo
        financiero. La tienda solo dice "sin interés" cuando `cftPercent` es 0.
      required: [installments, installmentAmountArs, totalArs, cftPercent, teaPercent, label]
      properties:
        installments:
          type: integer
          minimum: 1
          maximum: 24
          description: Cantidad de cuotas; 1 es el pago en un solo pago.
          example: 6
        installmentAmountArs:
          description: Importe de cada cuota, en pesos enteros.
          $ref: '#/components/schemas/TotalArs'
        totalArs:
          description: Total que se paga con esta cantidad de cuotas, con el costo financiero incluido.
          $ref: '#/components/schemas/TotalArs'
        cftPercent:
          type: number
          minimum: 0
          maximum: 1000
          description: Costo financiero total (CFT) de la opción, en porcentaje con dos decimales. 0 si no tiene interés.
          example: 45.9
        teaPercent:
          type: number
          minimum: 0
          maximum: 1000
          description: Tasa efectiva anual (TEA) de la opción, en porcentaje con dos decimales. 0 si no tiene interés.
          example: 38
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: Texto de la opción tal como lo informa el back (en el modo vivo, el mensaje recomendado de Mercado Pago). Es informativo, porque la tienda arma lo que muestra con los números.
          example: 6 cuotas de $8.317 (CFT 45,90 %)
      example:
        installments: 6
        installmentAmountArs: 8317
        totalArs: 49902
        cftPercent: 45.9
        teaPercent: 38
        label: 6 cuotas de $8.317 (CFT 45,90 %)
    ReviewInput:
      type: object
      description: Reseña que envía un visitante.
      required: [rating, authorName, text, website]
      properties:
        rating:
          type: number
          multipleOf: 0.5
          minimum: 1
          maximum: 5
          description: Puntuación en estrellas, de 1 a 5, en pasos de media estrella.
          example: 5
        authorName:
          type: [string, 'null']
          maxLength: 40
          description: Nombre con el que firma, o `null` para firmar como "Anónimo".
          example: Paula N.
        text:
          type: string
          minLength: 10
          maxLength: 600
          description: Texto de la reseña, de 10 a 600 caracteres.
          example: Muuu. Es el mate más lindo que tengo.
        website:
          $ref: '#/components/schemas/Honeypot'
    ReviewReceipt:
      type: object
      description: Confirmación de que la reseña se recibió.
      required: [status]
      properties:
        status:
          type: string
          const: pending
          description: Estado de la reseña; siempre `pending`, porque espera su aprobación.
          example: pending
    ContactInput:
      type: object
      description: Mensaje del formulario de contacto.
      required: [name, email, orderNumber, reason, message, website]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          description: Nombre de quien escribe, de 2 a 50 caracteres.
          example: Lucía Pérez
        email:
          $ref: '#/components/schemas/Email'
        orderNumber:
          description: Número del pedido del que se trata, o `null` si no corresponde.
          oneOf:
            - $ref: '#/components/schemas/OrderNumber'
            - type: 'null'
        reason:
          $ref: '#/components/schemas/ContactReason'
        message:
          type: string
          minLength: 10
          maxLength: 2000
          description: Mensaje, de 10 a 2000 caracteres.
          example: Pedí un mate hace una semana y todavía no tengo novedades del envío.
        website:
          $ref: '#/components/schemas/Honeypot'
    WithdrawalInput:
      type: object
      description: Solicitud de arrepentimiento de una compra.
      required: [name, email, orderNumber, comment, website]
      properties:
        name:
          $ref: '#/components/schemas/PersonName'
        email:
          $ref: '#/components/schemas/Email'
        orderNumber:
          description: Número del pedido que se quiere devolver, o `null` si no lo tiene a mano.
          oneOf:
            - $ref: '#/components/schemas/OrderNumber'
            - type: 'null'
        comment:
          type: [string, 'null']
          maxLength: 2000
          description: Comentario opcional, de hasta 2000 caracteres.
          example: Me llegó en perfecto estado, pero me arrepentí de la compra.
        website:
          $ref: '#/components/schemas/Honeypot'
    WithdrawalReceipt:
      type: object
      description: Comprobante de una solicitud de arrepentimiento.
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
          description: Código de comprobante de la solicitud, para que la persona haga el seguimiento.
          example: ARR-00031
    MercadoPagoWebhookEvent:
      type: object
      description: >-
        Notificación de Mercado Pago. Conserva el formato de Mercado Pago (con `snake_case`) y puede
        traer más campos que los que se listan acá, que el back ignora.
      required: [type, data]
      properties:
        type:
          type: string
          description: Tipo de evento; para los pagos vale `payment`.
          example: payment
        action:
          type: string
          description: Acción que originó la notificación, por ejemplo `payment.created` o `payment.updated`.
          example: payment.updated
        data:
          type: object
          description: Recurso al que se refiere la notificación.
          required: [id]
          properties:
            id:
              type: string
              description: Identificador del pago en Mercado Pago.
              example: '1234567890'
    Customer:
      type: object
      description: Datos de un cliente.
      required: [email, firstName, lastName, phone]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        firstName:
          $ref: '#/components/schemas/PersonName'
        lastName:
          $ref: '#/components/schemas/PersonName'
        phone:
          description: Teléfono, o `null` si no lo cargó.
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
      example:
        email: vos@ejemplo.com
        firstName: Lucía
        lastName: Pérez
        phone: '1123456789'
    CustomerUpdate:
      type: object
      description: Cambios a los datos del cliente. Solo se modifican los campos que vienen.
      minProperties: 1
      properties:
        firstName:
          $ref: '#/components/schemas/PersonName'
        lastName:
          $ref: '#/components/schemas/PersonName'
        phone:
          description: Teléfono nuevo, o `null` para borrarlo.
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
    AddressBookInput:
      description: Dirección que el cliente guarda en su libreta.
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          required: [label, isDefault]
          properties:
            label:
              type: [string, 'null']
              maxLength: 30
              description: Nombre con el que el cliente reconoce la dirección ("Casa", "Trabajo"), o `null`.
              example: Casa
            isDefault:
              type: boolean
              description: Si es la dirección predeterminada. Solo una lo es.
              example: true
    Address:
      description: Dirección de la libreta del cliente.
      allOf:
        - $ref: '#/components/schemas/AddressBookInput'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              description: Identificador de la dirección.
              example: adr-0001
    RegisterInput:
      type: object
      description: Datos para crear una cuenta.
      required: [email, firstName, lastName, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        firstName:
          $ref: '#/components/schemas/PersonName'
        lastName:
          $ref: '#/components/schemas/PersonName'
        password:
          $ref: '#/components/schemas/Password'
    LoginInput:
      type: object
      description: Datos para iniciar sesión.
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: Contraseña de la cuenta. No se le exige la fortaleza de una contraseña nueva.
          example: mate-con-yerba-2026
    ForgotPasswordInput:
      type: object
      description: Pedido de cambio de contraseña.
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    ResetPasswordInput:
      type: object
      description: Contraseña nueva, con el token del enlace que llegó por mail.
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: Token del enlace de cambio de contraseña. Es de un solo uso y vence.
          example: rt_7d6c5b4a39281706f5e4d3c2b1a09f8e
        password:
          $ref: '#/components/schemas/Password'
    CsrfToken:
      type: object
      description: Token anti-CSRF para las escrituras de la cuenta.
      required: [csrfToken]
      properties:
        csrfToken:
          type: string
          minLength: 1
          description: Token que va en la cabecera `X-CSRF-Token`. Está ligado a la sesión actual.
          example: 4b8f2a7c91d3e65f0a1b2c3d4e5f6a7b
    ProductStatus:
      type: string
      description: >-
        Estado de un producto. `draft` es un borrador que la tienda no ve, `published` está a la
        venta y `archived` se conserva con sus pedidos pero no se muestra.
      enum: [draft, published, archived]
      example: published
    ReviewStatus:
      type: string
      description: >-
        Estado de una reseña. `pending` espera la moderación, `approved` se muestra y cuenta en el
        promedio y `hidden` quedó oculta.
      enum: [pending, approved, hidden]
      example: approved
    ContactMessageKind:
      type: string
      description: Tipo de mensaje de la bandeja. `contact` es del formulario de contacto y `withdrawal` una solicitud de arrepentimiento.
      enum: [contact, withdrawal]
      example: contact
    AdminLoginInput:
      type: object
      description: Datos para iniciar sesión en el dashboard.
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: Contraseña del administrador. No se le exige la fortaleza de una contraseña nueva.
          example: mate-con-yerba-2026
    AdminLoginResult:
      type: object
      description: Sesión del dashboard recién iniciada. La cookie de sesión viaja aparte, en `Set-Cookie`.
      required: [email, csrfToken, expiresAt]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        csrfToken:
          type: string
          minLength: 1
          description: Token que va en la cabecera `X-CSRF-Token` de las escrituras. Está ligado a la sesión que se acaba de iniciar.
          example: 4b8f2a7c91d3e65f0a1b2c3d4e5f6a7b
        expiresAt:
          type: string
          format: date-time
          description: Cuándo vence la sesión, en UTC.
          example: '2026-10-21T01:00:00Z'
    AdminSession:
      type: object
      description: Sesión activa del dashboard.
      required: [email, expiresAt]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        expiresAt:
          type: string
          format: date-time
          description: Cuándo vence la sesión, en UTC.
          example: '2026-10-21T01:00:00Z'
    AdminPasswordChange:
      type: object
      description: Cambio de la contraseña del administrador.
      required: [currentPassword, newPassword, confirmation]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          description: Contraseña actual.
          example: mate-con-yerba-2026
        newPassword:
          $ref: '#/components/schemas/Password'
        confirmation:
          type: string
          maxLength: 128
          description: Repetición de la contraseña nueva. Tiene que ser igual a `newPassword`; si no, el back responde `422` con el error en este campo.
          example: mate-con-yerba-2027
    DashboardSummary:
      type: object
      description: Cifras del inicio del dashboard.
      required:
        - salesTodayArs
        - salesLast7DaysArs
        - ordersToShip
        - lowStock
        - pendingReviews
        - unreadMessages
        - paymentAlerts
      properties:
        salesTodayArs:
          type: integer
          minimum: 0
          description: Total vendido hoy (día de Buenos Aires), sumando los pedidos pagados. Es una suma, así que no tiene el tope de `Pesos`.
          example: 79998
        salesLast7DaysArs:
          type: integer
          minimum: 0
          description: Total vendido en los últimos 7 días (hoy incluido), sumando los pedidos pagados. Es una suma, así que no tiene el tope de `Pesos`.
          example: 412500
        ordersToShip:
          type: integer
          minimum: 0
          description: Pedidos pagados o en preparación que todavía no se despacharon.
          example: 3
        lowStock:
          type: array
          description: Productos publicados con stock menor o igual al umbral `lowStockThreshold` de los ajustes.
          items:
            type: object
            description: Producto con poco stock.
            required: [id, name, stock]
            properties:
              id:
                type: string
                description: Identificador del producto.
                example: prd-imperial-premium
              name:
                type: string
                description: Nombre del producto.
                example: Mate Imperial Premium
              stock:
                type: integer
                minimum: 0
                description: Unidades que quedan.
                example: 2
        pendingReviews:
          type: integer
          minimum: 0
          description: Reseñas pendientes de moderación.
          example: 4
        unreadMessages:
          type: integer
          minimum: 0
          description: Mensajes de la bandeja sin leer.
          example: 2
        paymentAlerts:
          type: array
          description: Pedidos con un problema de pago que hay que mirar.
          items:
            type: object
            description: Alerta de pago de un pedido.
            required: [orderNumber, kind, message]
            properties:
              orderNumber:
                $ref: '#/components/schemas/OrderNumber'
              kind:
                type: string
                description: >-
                  Qué pasó. `charged_back` es un contracargo, `in_dispute` una mediación abierta y
                  `duplicate_payment` un segundo pago aprobado para un pedido ya pagado, que hay
                  que devolver.
                enum: [charged_back, in_dispute, duplicate_payment]
                example: duplicate_payment
              message:
                type: string
                description: Explicación para mostrar, en español.
                example: Se aprobó un segundo pago de $46.499. Devolvelo desde Mercado Pago.
    ImageInput:
      type: object
      description: Foto que ya se subió a Cloudinary, como la manda el dashboard.
      required: [publicId, width, height, alt]
      properties:
        publicId:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Identificador de la foto en el proveedor de imágenes, el que devolvió la subida. Si el
            back no conoce esa foto responde `422` en ese campo: `images.N.publicId` en un
            producto, `image.publicId` en una línea y `partners.N.photo.publicId` en Nosotros.
          example: galpon/productos/mate-imperial-premium
        width:
          type: integer
          minimum: 1
          description: Ancho en píxeles.
          example: 960
        height:
          type: integer
          minimum: 1
          description: Alto en píxeles.
          example: 1280
        alt:
          type: string
          minLength: 3
          maxLength: 120
          description: Texto alternativo para lectores de pantalla, de 3 a 120 caracteres.
          example: Mate Imperial Premium con virola de alpaca cincelada
    ProductTabsOverride:
      type: object
      description: Textos propios de un producto para las pestañas Materiales y Cuidado. Una pestaña en `null` usa el texto de su grupo.
      required: [materials, care]
      properties:
        materials:
          type: [string, 'null']
          maxLength: 2000
          description: Texto de la pestaña de materiales, o `null` para usar el del grupo.
          example: Calabaza natural curable, virola de alpaca y cuero vacuno cosido a mano.
        care:
          type: [string, 'null']
          maxLength: 2000
          description: Texto de la pestaña de cuidado, o `null` para usar el del grupo.
          example: null
    AdminProduct:
      description: >-
        Producto como lo ve el dashboard: todo lo de la ficha (`ProductDetail`) más lo que la
        tienda no muestra. `tabs` sigue viniendo combinado; `tabsOverride` trae solo el texto
        propio del producto.
      allOf:
        - $ref: '#/components/schemas/ProductDetail'
        - type: object
          required: [status, stock, sequence, tabsOverride, previousSlugs, createdAt, updatedAt]
          properties:
            status:
              $ref: '#/components/schemas/ProductStatus'
            stock:
              type: integer
              minimum: 0
              maximum: 9999
              description: Unidades en stock.
              example: 12
            sequence:
              type: integer
              minimum: 1
              description: Número correlativo del producto; `code` es este número con formato ("N°07"). Lo asigna el back.
              example: 1
            tabsOverride:
              description: Textos propios de las pestañas, o `null` si el producto usa los de su grupo.
              oneOf:
                - $ref: '#/components/schemas/ProductTabsOverride'
                - type: 'null'
            previousSlugs:
              type: array
              description: Slugs anteriores del producto. La tienda redirige cada uno al `slug` actual.
              items:
                type: string
                maxLength: 80
                pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
              example: [mate-imperial]
            createdAt:
              type: string
              format: date-time
              description: Momento en que se creó el producto, en UTC.
              example: '2026-08-01T12:00:00Z'
            updatedAt:
              type: string
              format: date-time
              description: Momento de la última modificación, en UTC.
              example: '2026-10-15T18:30:00Z'
    AdminProductInput:
      type: object
      description: >-
        Producto que guarda el dashboard. Las reglas son las de `productFormSchema` de
        `@galpon/schemas`. `code`, `sequence`, `previousSlugs` y las fechas los pone el back, y
        las opciones de un mate no se editan.
      required: [name, slug, categoryId, description, priceArs, stock, featured, status, images]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
          description: Nombre del producto, de 3 a 120 caracteres.
          example: Mate Imperial Premium
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Identificador legible para la dirección web. Minúsculas, números y guiones; tiene que ser único.
          example: mate-imperial-premium
        categoryId:
          type: string
          minLength: 1
          maxLength: 100
          description: Identificador de la línea del producto.
          example: cat-imperiales
        description:
          type: string
          minLength: 10
          maxLength: 2000
          description: Descripción del producto, de 10 a 2000 caracteres.
          example: Imperial con virola y base de alpaca con pelotitas en bronce.
        priceArs:
          type: [integer, 'null']
          minimum: 1
          maximum: 99999999
          description: Precio de venta con impuestos incluidos, de 1 a 99.999.999 pesos, o `null` para que el producto quede "a consultar".
          example: 39999
        stock:
          type: integer
          minimum: 0
          maximum: 9999
          description: Unidades en stock, de 0 a 9999.
          example: 12
        featured:
          type: boolean
          description: Si es un producto destacado.
          example: false
        status:
          type: string
          description: Estado del producto. Archivar se hace con `POST /admin/products/{id}/archive`; con `published` se vuelve a publicar uno archivado.
          enum: [draft, published]
          example: published
        tabsOverride:
          description: Textos propios de las pestañas. Si falta o es `null`, el producto usa los de su grupo.
          oneOf:
            - $ref: '#/components/schemas/ProductTabsOverride'
            - type: 'null'
        images:
          type: array
          description: Fotos del producto, hasta 8. La primera es la principal.
          maxItems: 8
          items:
            $ref: '#/components/schemas/ImageInput'
        expectedUpdatedAt:
          type: string
          format: date-time
          description: >-
            `updatedAt` del producto cuando se abrió para editarlo. Solo lo usa `PATCH
            /admin/products/{id}`: si no coincide con el `updatedAt` guardado responde `409` con
            `type` `product_changed` y no guarda nada; si falta, guarda igual (gana el último).
            `POST /admin/products` lo ignora.
          example: '2026-10-15T18:30:00Z'
    AdminProductPage:
      type: object
      description: Página de productos del dashboard.
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          description: Productos de la página.
          items:
            $ref: '#/components/schemas/AdminProduct'
        page:
          type: integer
          description: Número de esta página, empezando en 1.
          minimum: 1
          example: 1
        pageSize:
          type: integer
          description: Cantidad de elementos por página que aplicó el servidor.
          minimum: 1
          maximum: 100
          example: 24
        total:
          type: integer
          description: Cantidad total de productos que cumplen los filtros, en todas las páginas.
          minimum: 0
          example: 27
    CategoryInput:
      type: object
      description: >-
        Línea que guarda el dashboard. Las reglas son las de `categoryFormSchema` de
        `@galpon/schemas`. `position` y `productCount` los calcula el back.
      required: [name, slug, group, blurb, image]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
          description: Nombre de la línea, de 2 a 60 caracteres.
          example: Imperiales
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Identificador legible para la dirección web. Minúsculas, números y guiones; tiene que ser único.
          example: imperiales
        group:
          $ref: '#/components/schemas/ProductGroup'
        blurb:
          type: string
          maxLength: 200
          description: Descripción corta de la línea, de hasta 200 caracteres. Puede ser vacía.
          example: Boca ancha, virola de alpaca y pie de apoyo. El mate de ceremonia.
        image:
          description: Foto de la línea, o `null` si no tiene.
          oneOf:
            - $ref: '#/components/schemas/ImageInput'
            - type: 'null'
    CategoryOrderInput:
      type: object
      description: Orden nuevo de las líneas.
      required: [ids]
      properties:
        ids:
          type: array
          description: Identificadores de todas las líneas, una vez cada una, en el orden en que se muestran.
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 80
          example: [cat-imperiales, cat-torpedos]
    MediaSignatureInput:
      type: object
      description: Pedido de firma para subir una foto.
      required: [purpose]
      properties:
        purpose:
          type: string
          description: >-
            Para qué es la foto; define la carpeta de Cloudinary donde se guarda: `product` →
            `galpon/productos`, `category` → `galpon/lineas`, `partner` → `galpon/socios` y
            `site` → `galpon/sitio`.
          enum: [product, category, partner, site]
          example: product
    MediaSignature:
      type: object
      description: >-
        Datos firmados para subir una foto a Cloudinary desde el navegador. La subida
        (`POST https://api.cloudinary.com/v1_1/{cloudName}/image/upload`, `multipart/form-data`)
        manda exactamente `file`, `api_key` (este `apiKey`), `timestamp`, `signature` y `folder`.
        La firma cubre `folder` y `timestamp`, así que otro parámetro la invalida.
      required: [timestamp, signature, apiKey, cloudName, folder]
      properties:
        timestamp:
          type: integer
          minimum: 0
          description: Momento de la firma, en segundos desde 1970 (hora Unix). Cloudinary lo exige en la subida.
          example: 1792508400
        signature:
          type: string
          minLength: 1
          description: Firma de los parámetros de la subida, calculada por el back con el secreto de la cuenta.
          example: a1b2c3d4e5f60718293a4b5c6d7e8f9012345678
        apiKey:
          type: string
          minLength: 1
          description: Clave pública de la cuenta de Cloudinary.
          example: '123456789012345'
        cloudName:
          type: string
          minLength: 1
          description: Nombre de la cuenta de Cloudinary.
          example: galpon
        folder:
          type: string
          minLength: 1
          description: Carpeta donde se guarda la foto; la subida tiene que mandar este mismo valor.
          example: galpon/productos
    AdminOrderPage:
      type: object
      description: Página de pedidos del dashboard.
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          description: Pedidos de la página.
          items:
            $ref: '#/components/schemas/Order'
        page:
          type: integer
          description: Número de esta página, empezando en 1.
          minimum: 1
          example: 1
        pageSize:
          type: integer
          description: Cantidad de pedidos por página que aplicó el servidor.
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          description: Cantidad total de pedidos que cumplen los filtros, en todas las páginas.
          minimum: 0
          example: 58
    OrderStatusChange:
      type: object
      description: Cambio de estado de un pedido que pide el dashboard.
      required: [status, carrier, trackingNumber, note]
      properties:
        status:
          type: string
          description: Estado al que pasa el pedido.
          enum: [preparing, shipped, delivered, cancelled]
          example: shipped
        carrier:
          type: [string, 'null']
          minLength: 2
          maxLength: 40
          description: Empresa de transporte. Obligatoria con `shipped`; con los demás estados va en `null`.
          example: Andreani
        trackingNumber:
          type: [string, 'null']
          minLength: 4
          maxLength: 40
          description: Número de seguimiento. Obligatorio con `shipped`; con los demás estados va en `null`.
          example: AND123456789
        note:
          type: [string, 'null']
          maxLength: 500
          description: Nota que queda en el historial del pedido, o `null` si no hay.
          example: null
    AdminSettings:
      description: >-
        Ajustes del dashboard: los públicos de la tienda (`PublicSettings`) más el umbral de poco
        stock y el IVA, que solo ve el dashboard.
      allOf:
        - $ref: '#/components/schemas/PublicSettings'
        - type: object
          required: [lowStockThreshold, vatRatePercent]
          properties:
            lowStockThreshold:
              type: integer
              minimum: 0
              maximum: 999
              description: Un producto cuenta como "con poco stock" cuando le quedan este número de unidades o menos.
              example: 3
            vatRatePercent:
              type: number
              minimum: 0
              maximum: 100
              description: Alícuota de IVA en porcentaje, de 0 a 100, con decimales si hace falta (10,5). Con ella se calcula el precio sin impuestos nacionales.
              example: 21
    AdminReview:
      description: Reseña como la ve el dashboard, en cualquier estado y con el producto al que pertenece.
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          required: [status, featured, product]
          properties:
            status:
              $ref: '#/components/schemas/ReviewStatus'
            featured:
              type: boolean
              description: Si la reseña es destacada. Se muestra en el inicio mientras esté aprobada.
              example: false
            product:
              type: object
              description: Producto reseñado.
              required: [slug, name]
              properties:
                slug:
                  type: string
                  description: Slug actual del producto.
                  example: mate-imperial-premium
                name:
                  type: string
                  description: Nombre del producto.
                  example: Mate Imperial Premium
    AdminReviewPage:
      type: object
      description: Página de reseñas del dashboard.
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          description: Reseñas de la página.
          items:
            $ref: '#/components/schemas/AdminReview'
        page:
          type: integer
          description: Número de esta página, empezando en 1.
          minimum: 1
          example: 1
        pageSize:
          type: integer
          description: Cantidad de reseñas por página que aplicó el servidor.
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          description: Cantidad total de reseñas que cumplen el filtro, en todas las páginas.
          minimum: 0
          example: 12
    AdminReviewUpdate:
      type: object
      description: Cambios a una reseña. Solo se modifican los campos que vienen.
      minProperties: 1
      properties:
        status:
          $ref: '#/components/schemas/ReviewStatus'
        featured:
          type: boolean
          description: Si la reseña es destacada. Se muestra en el inicio mientras esté aprobada.
          example: true
    ContactMessage:
      type: object
      description: Mensaje de la bandeja del dashboard, del formulario de contacto o de una solicitud de arrepentimiento.
      required: [id, kind, name, email, orderNumber, reason, message, code, createdAt, read]
      properties:
        id:
          type: string
          description: Identificador del mensaje.
          example: msg-0001
        kind:
          $ref: '#/components/schemas/ContactMessageKind'
        name:
          type: string
          description: Nombre de quien escribió.
          example: Lucía Pérez
        email:
          $ref: '#/components/schemas/Email'
        orderNumber:
          description: Número del pedido del que se trata, o `null` si no corresponde.
          oneOf:
            - $ref: '#/components/schemas/OrderNumber'
            - type: 'null'
        reason:
          description: Motivo elegido en el formulario de contacto, o `null` en un arrepentimiento.
          oneOf:
            - $ref: '#/components/schemas/ContactReason'
            - type: 'null'
        message:
          type: [string, 'null']
          description: Texto del mensaje, o `null` si es un arrepentimiento sin comentario.
          example: Pedí un mate hace una semana y todavía no tengo novedades del envío.
        code:
          type: [string, 'null']
          description: Código de comprobante de un arrepentimiento, o `null` en un mensaje de contacto.
          example: null
        createdAt:
          type: string
          format: date-time
          description: Momento en que llegó el mensaje, en UTC.
          example: '2026-10-20T15:00:00Z'
        read:
          type: boolean
          description: Si el mensaje ya se leyó.
          example: false
    ContactMessagePage:
      type: object
      description: Página de mensajes de la bandeja.
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          description: Mensajes de la página.
          items:
            $ref: '#/components/schemas/ContactMessage'
        page:
          type: integer
          description: Número de esta página, empezando en 1.
          minimum: 1
          example: 1
        pageSize:
          type: integer
          description: Cantidad de mensajes por página que aplicó el servidor.
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          description: Cantidad total de mensajes que cumplen los filtros, en todas las páginas.
          minimum: 0
          example: 9
    ContactMessageUpdate:
      type: object
      description: Cambio de un mensaje de la bandeja.
      required: [read]
      properties:
        read:
          type: boolean
          description: Si el mensaje queda como leído (`true`) o como no leído (`false`).
          example: true
